:"大量棋局"},{"id":"play","label":"下跳棋"},{"id":"level","label":"弈棋水平"}]}}},"beats":[{"id":"b1","show":["melon"],"book":["1.1","1.2","1.3.1","1.3.2"],"step":"try","say":"敲一敲这个瓜。","point":"melon.sprite:big","task":{"goal":{"op":"contains","path":"melon.tapped","value":"big"},"ok":"咚咚——这种声音叫浊响。"}},{"id":"b2","set":{"melon.revealed":["tag1","tag2","tag3"]},"say":"色泽青绿，根蒂蜷缩，敲声浊响。"},{"id":"b3","step":"predict","say":"没切开，你觉得它是好瓜吗？","ask":{"mode":"predict","ref":"syl:1.1#t1","choices":[{"id":"good","text":"好瓜"},{"id":"bad","text":"坏瓜"},{"id":"unsure","text":"说不准，得切开看"}]}},{"id":"b4","show":["melon","cut"],"step":"reveal","say":"切开看看。","point":"cut.button","task":{"goal":{"op":"contains","path":"melon.revealed","value":"big"},"ok":[{"when":{"op":"eq","path":"ask.b3.choice","value":"good"},"text":"是好瓜，你猜对了。"},{"when":{"op":"eq","path":"ask.b3.choice","value":"bad"},"text":"是好瓜。你猜的是坏瓜。"},{"text":"是好瓜。你说要切开才知道，开头那个人却挑了就走。"}]}},{"id":"b5","step":"predict","say":"开头那个人没切开就认定是好瓜，还认定明天是好天、这门课成绩差不了。他凭什么？","ask":{"mode":"predict","ref":"syl:1.1#t1","choices":[{"id":"exp","text":"以前遇到过很多类似的情况"},{"id":"luck","text":"运气好，碰巧猜中"},{"id":"told","text":"有人事先告诉了他"}]}},{"id":"b6","book":["1.5.7"],"step":"reveal","say":[{"when":{"op":"eq","path":"ask.b5.choice","value":"exp"},"text":"和你想的一样。"},{"text":"答案是经验。"}]},{"id":"b7","book":["1.6.1","1.6.2"],"step":"predict","say":"计算机没吃过瓜。你觉得它能帮忙吗？","ask":{"mode":"predict","ref":"syl:1.1#t1","choices":[{"id":"data","text":"能，把以前的瓜记成数据交给它"},{"id":"rule","text":"能，但得由人把挑瓜规则一条条写给它"},{"id":"no","text":"不能，它没有经验"}]}},{"id":"b8","show":["feed"],"step":"try","say":[{"when":{"op":"eq","path":"ask.b7.choice","value":"data"},"text":"就按你说的：把表 1.1 的 {data.t11.count|int} 条瓜的记录交给挑瓜机。"},{"text":"试试另一个办法：不写规则，把表 1.1 的 {data.t11.count|int} 条瓜的记录交给挑瓜机。"}],"point":"feed.next_item","task":{"goal":{"op":"gte","path":"feed.placed_count","value":{"path":"data.t11.count"}},"ok":"{feed.placed_count|int} 条记录都交给它了。"}},{"id":"b9","show":["feed","recs","crank"],"step":"try","say":"转动把手，让它从这些数据里学。","point":"crank.button","book_done":["1.7.2"],"task":{"goal":{"op":"eq","path":"crank.pressed","value":true},"ok":"它学出一条规律：根蒂蜷缩的是好瓜。"}},{"id":"b10","step":"name","book":["1.9.1"],"say":"收进卡册：[[学习算法]]和[[模型]]。","card":[{"ref":"syl:1.1#t2"},{"ref":"syl:1.1#t3"}]},{"id":"b11","show":["model"],"step":"apply","say":"来了个没剖开的新瓜，浅白色的，表里没有一模一样的。把它拖到模型上。","point":"model.next_item","book_done":["1.7.3"],"task":{"goal":{"op":"gte","path":"model.placed_count","value":1},"ok":"模型说：好瓜。没见过的瓜，它照样给出了判断。"}},{"id":"b12","step":"judge","say":"学习算法和模型，哪句说对了它们的关系？","ask":{"ref":"syl:1.1#t2","choices":[{"id":"a","text":"学习算法从数据中产生模型，模型再判断新瓜","correct":true,"reply":"对：先有学习算法把数据变成模型，再由模型去判断。"},{"id":"b","text":"模型从数据中产生学习算法","reply":"方向反了：学习算法是方法，模型是它从数据中学出来的结果。"},{"id":"c","text":"两者是同一个东西","reply":"学习算法是「怎么学」，模型是「学出了什么」：转把手的是前者，判断新瓜的是后者。"}]}},{"id":"b13","step":"name","book":["1.7.1"],"say":"这一整套，就是[[机器学习]]。","card":{"ref":"syl:1.1#t1"}},{"id":"b14","show":["etp"],"step":"apply","book":["1.8.1"],"say":"把 E、T、P 放到挑瓜机身上。","point":"etp.next_item","task":{"goal":{"op":"eq","path":"etp.correct_count","value":3},"ok":"挑瓜机利用这 4 条记录（E），在判断新瓜（T）上判得准（P）：按这个定义，它进行了学习。"}},{"id":"b15","show":["etp2"],"step":"apply","book":["1.168.1"],"say":"再看一个最早会学习的程序。它的 E、T、P 各是什么？","point":"etp2.next_item","task":{"goal":{"op":"eq","path":"etp2.correct_count","value":3},"ok":"它分析大量棋局（E），在下跳棋（T）上越下越好（P）：和挑瓜机是同一回事。"}},{"id":"b16","book":["1.168.3"],"say":"机器学习这个名字，就是他起的。"},{"id":"b17","step":"compare","say":"开头那个人挑瓜，和挑瓜机判断新瓜，哪里一样？","ask":{"ref":"syl:1.1#t1","choices":[{"id":"same","text":"都从以前的瓜里得出规律，再用来判断新瓜","correct":true,"reply":"对。他的经验来自吃过、看过的瓜，挑瓜机的经验来自数据。"},{"id":"memo","text":"都把见过的瓜一个个记住，碰到一模一样的才能判断","reply":"新瓜是浅白色的，记录里没有一模一样的瓜，模型照样判断了。靠的是学出来的规律，不是逐个记住。"},{"id":"cut","text":"都要先把新瓜切开，看了瓤才能判断","reply":"不用切开：模型没切就判断了新瓜，开头那个人也是挑了就走。"}]}},{"id":"b18","say":"下一关：机器看不懂瓜，得先把瓜变成它能读的东西。"}],"bank":[{"id":"q1","ref":"syl:1.1#t1","format":"choice","stem":"机器学习主要研究的是什么？","choices":[{"id":"a","text":"从数据中产生模型的算法","reply":"机器学习研究的主要内容是学习算法：从数据中产生模型的算法。","correct":true},{"id":"b","text":"怎样把数据存进计算机","reply":"存数据只是准备工作；机器学习研究的是怎样从数据中产生模型。"},{"id":"c","text":"怎样让计算机运行得更快","reply":"那是别的领域关心的事；机器学习研究的是从数据中学出模型的算法。"}]},{"id":"q2","ref":"syl:1.1#t2","format":"choice","stem":"学习算法和模型是什么关系？","choices":[{"id":"a","text":"学习算法从数据中产生模型","reply":"把数据交给学习算法，它就产生模型；模型再用来判断新瓜。","correct":true},{"id":"b","text":"模型从数据中产生学习算法","reply":"方向反了：学习算法是方法，模型是它学出来的结果。"},{"id":"c","text":"两者是同一个东西","reply":"学习算法是「怎么学」，模型是「学出了什么」，不是一回事。"}]},{"id":"q3","ref":"syl:1.1#t3","format":"write","use":"recall","stem":"从数据中学得、用来判断新瓜的结果，叫什么？","fail":[{"text":"它是学习算法的产物，名字只有两个字。"}]},{"id":"q4","ref":"syl:1.1#t1","format":"choice","stem":"一个识别垃圾邮件的程序，看了成千上万封标好的邮件后越认越准。按 Mitchell 的定义，E 是什么？","choices":[{"id":"a","text":"那些标好的邮件","correct":true,"reply":"对：E 是程序利用的经验，这里就是标好的邮件。"},{"id":"b","text":"识别垃圾邮件这件事","reply":"那是任务 T；E 是它利用的经验，也就是标好的邮件。"},{"id":"c","text":"认得准不准","reply":"那是性能 P；E 是它利用的经验，也就是标好的邮件。"}]}]}},"data":{"t11":{"id":"t11","origin":"book","locator":"表 1.1 西瓜数据集","passage":["1.37#表1.1 西瓜数"],"columns":["编号","色泽","根蒂","敲声","好瓜"],"rows":[[1,"青绿","蜷缩","浊响",1],[2,"乌黑","蜷缩","浊响",1],[3,"青绿","硬挺","清脆",0],[4,"乌黑","稍蜷","沉闷",0]]}},"original":true,"texts":{"1.1":{"kind":"heading","level":1,"text":"第1章 绪论","pages":[1],"html":"第1章 绪论"},"1.2":{"kind":"heading","level":2,"text":"1.1 引言","pages":[1],"html":"1.1 引言"},"1.3":{"kind":"para","text":"傍晚小街路面上沁出微雨后的湿润，和煦的细风吹来，抬头看看天边的晚霞，嗯，明天又是一个好天气.走到水果摊旁，挑了个根蒂蜷缩、敲起来声音浊响的青绿西瓜，一边满心期待着皮薄肉厚瓤甜的爽落感，一边愉快地想着，这学期狠下了工夫，基础概念弄得清清楚楚，算法作业也是信手拈来，这门课成绩一定差不了！","pages":[1],"sentences":[{"id":"1.3.1","text":"傍晚小街路面上沁出微雨后的湿润，和煦的细风吹来，抬头看看天边的晚霞，嗯，明天又是一个好天气.","html":"傍晚小街路面上沁出微雨后的湿润，和煦的细风吹来，抬头看看天边的晚霞，嗯，明天又是一个好天气．"},{"id":"1.3.2","text":"走到水果摊旁，挑了个根蒂蜷缩、敲起来声音浊响的青绿西瓜，一边满心期待着皮薄肉厚瓤甜的爽落感，一边愉快地想着，这学期狠下了工夫，基础概念弄得清清楚楚，算法作业也是信手拈来，这门课成绩一定差不了！","html":"走到水果摊旁，挑了个根蒂蜷缩、敲起来声音浊响的青绿西瓜，一边满心期待着皮薄肉厚瓤甜的爽落感，一边愉快地想着，这学期狠下了工夫，基础概念弄得清清楚楚，算法作业也是信手拈来，这门课成绩一定差不了！"}],"html":""},"1.4":{"kind":"para","text":"希望各位在学期结束时有这样的感觉.作为开场，我们先大致了解一下什么是“机器学习”（machine learning）.","pages":[1],"sentences":[{"id":"1.4.1","text":"希望各位在学期结束时有这样的感觉.","html":"希望各位在学期结束时有这样的感觉．"},{"id":"1.4.2","text":"作为开场，我们先大致了解一下什么是“机器学习”（machine learning）.","html":"作为开场，我们先大致了解一下什么是“机器学习”（machine learning）．"}],"html":""},"1.5":{"kind":"para","text":"回头看第一段话，我们会发现这里涉及很多基于经验做出的预判.例如，为什么看到微湿路面、感到和风、看到晚霞，就认为明天是好天呢？这是因为在我们的生活经验中已经遇见过很多类似情况，头一天观察到上述特征后，第二天天气通常会很好.为什么色泽青绿、根蒂蜷缩、敲声浊响，就能判断出是正熟的好瓜？因为我们吃过、看过很多西瓜，所以基于色泽、根蒂、敲声这几个特征我们就可以做出相当好的判断.类似的，我们从以往的学习经验知道，下足了工夫、弄清了概念、做好了作业，自然会取得好成绩.可以看出，我们能做出有效的预判，是因为我们已经积累了许多经验，而通过对经验的利用，就能对新情况做出有效的决策.","pages":[1],"sentences":[{"id":"1.5.1","text":"回头看第一段话，我们会发现这里涉及很多基于经验做出的预判.","html":"回头看第一段话，我们会发现这里涉及很多基于经验做出的预判．"},{"id":"1.5.2","text":"例如，为什么看到微湿路面、感到和风、看到晚霞，就认为明天是好天呢？","html":"例如，为什么看到微湿路面、感到和风、看到晚霞，就认为明天是好天呢？"},{"id":"1.5.3","text":"这是因为在我们的生活经验中已经遇见过很多类似情况，头一天观察到上述特征后，第二天天气通常会很好.","html":"这是因为在我们的生活经验中已经遇见过很多类似情况，头一天观察到上述特征后，第二天天气通常会很好．"},{"id":"1.5.4","text":"为什么色泽青绿、根蒂蜷缩、敲声浊响，就能判断出是正熟的好瓜？","html":"为什么色泽青绿、根蒂蜷缩、敲声浊响，就能判断出是正熟的好瓜？"},{"id":"1.5.5","text":"因为我们吃过、看过很多西瓜，所以基于色泽、根蒂、敲声这几个特征我们就可以做出相当好的判断.","html":"因为我们吃过、看过很多西瓜，所以基于色泽、根蒂、敲声这几个特征我们就可以做出相当好的判断．"},{"id":"1.5.6","text":"类似的，我们从以往的学习经验知道，下足了工夫、弄清了概念、做好了作业，自然会取得好成绩.","html":"类似的，我们从以往的学习经验知道，下足了工夫、弄清了概念、做好了作业，自然会取得好成绩．"},{"id":"1.5.7","text":"可以看出，我们能做出有效的预判，是因为我们已经积累了许多经验，而通过对经验的利用，就能对新情况做出有效的决策.","html":"可以看出，我们能做出有效的预判，是因为我们已经积累了许多经验，而通过对经验的利用，就能对新情况做出有效的决策．"}],"html":""},"1.6":{"kind":"para","text":"上面对经验的利用是靠我们人类自身完成的.计算机能帮忙吗？","pages":[1],"sentences":[{"id":"1.6.1","text":"上面对经验的利用是靠我们人类自身完成的.","html":"上面对经验的利用是靠我们人类自身完成的．"},{"id":"1.6.2","text":"计算机能帮忙吗？","html":"计算机能帮忙吗？"}],"html":""},"1.7":{"kind":"para","text":"机器学习正是这样一门学科，它致力于研究如何通过计算的手段，利用经验来改善系统自身的性能.在计算机系统中，“经验”通常以“数据”形式存在，因此，机器学习所研究的主要内容，是关于在计算机上从数据中产生“模型”（model）的算法，即“学习算法”（learning algorithm）.有了学习算法，我们把经验数据提供给它，它就能基于这些数据产生模型；在面对新的情况时（例如看到一个没剖开的西瓜），模型会给我们提供相应的判断（例如好瓜）.如果说计算机科学是研究关于“算法”的学问，那么类似的，可以说机器学习是研究关于“学习算法”的学问.","pages":[1],"sentences":[{"id":"1.7.1","text":"机器学习正是这样一门学科，它致力于研究如何通过计算的手段，利用经验来改善系统自身的性能.","html":"机器学习正是这样一门学科，它致力于研究如何通过计算的手段，利用经验来改善系统自身的性能．"},{"id":"1.7.2","text":"在计算机系统中，“经验”通常以“数据”形式存在，因此，机器学习所研究的主要内容，是关于在计算机上从数据中产生“模型”（model）的算法，即“学习算法”（learning algorithm）.","html":"在计算机系统中，“经验”通常以“数据”形式存在，因此，机器学习所研究的主要内容，是关于在计算机上从数据中产生“模型”（model）的算法，即“学习算法”（learning algorithm）．"},{"id":"1.7.3","text":"有了学习算法，我们把经验数据提供给它，它就能基于这些数据产生模型；在面对新的情况时（例如看到一个没剖开的西瓜），模型会给我们提供相应的判断（例如好瓜）.","html":"有了学习算法，我们把经验数据提供给它，它就能基于这些数据产生模型；在面对新的情况时（例如看到一个没剖开的西瓜），模型会给我们提供相应的判断（例如好瓜）．"},{"id":"1.7.4","text":"如果说计算机科学是研究关于“算法”的学问，那么类似的，可以说机器学习是研究关于“学习算法”的学问.","html":"如果说计算机科学是研究关于“算法”的学问，那么类似的，可以说机器学习是研究关于“学习算法”的学问．"}],"html":""},"1.8":{"kind":"note","text":"[Mitchell, 1997] 给出了一个更形式化的定义：假设用 $P$ 来评估计算机程序在某任务类 $T$ 上的性能，若一个程序通过利用经验 $E$ 在 $T$ 中任务上获得了性能改善，则我们就说关于 $T$ 和 $P$，该程序对 $E$ 进行了学习.","pages":[1],"sentences":[{"id":"1.8.1","text":"[Mitchell, 1997] 给出了一个更形式化的定义：假设用 $P$ 来评估计算机程序在某任务类 $T$ 上的性能，若一个程序通过利用经验 $E$ 在 $T$ 中任务上获得了性能改善，则我们就说关于 $T$ 和 $P$，该程序对 $E$ 进行了学习.","html":"[Mitchell, 1997] 给出了一个更形式化的定义：假设用 \u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: 0;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1.706ex\" height=\"1.545ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -683 754 683\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cdefs>\u003cpath id=\"MJX-1-NCM-I-1D443\" d=\"M555 683L235 683C212 683 201 682 201 660C201 649 212 644 234 644C254 644 294 647 294 631C294 629 293 623 290 613L158 82C152 60 142 47 128 42C121 40 103 39 72 39C50 39 40 37 40 16C40 5 46 0 59 0L184 3L248 2C259 2 299 0 312 0C328 0 336 8 336 24C336 34 325 39 304 39C264 39 244 43 244 52C244 52 245 55 247 68L307 312L472 312C537 312 599 332 657 371C722 414 754 467 754 530C754 629 660 683 555 683M524 644C611 644 654 614 654 554C654 498 626 423 597 397C559 363 509 346 447 346L313 346L379 610C387 644 387 644 429 644Z\">\u003c/path>\u003c/defs>\u003cg stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform 80 484 264 479 245C477 240 476 236 476 233C476 223 482 218 493 218C502 218 508 226 512 241L568 473C568 483 563 488 552 488C544 488 538 481 535 467C525 428 512 403 495 391C478 379 450 373 409 373L321 373L379 606C387 640 387 641 429 641L568 641C619 641 654 636 673 626C701 611 715 581 715 536C715 519 714 501 711 484C711 482 711 479 710 475L710 466C710 455 715 450 725 450C735 450 741 459 743 478L763 649C766 677 759 680 732 680L233 680C210 680 199 679 199 656Z\">\u003c/path>\u003c/defs>\u003cg stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\">\u003cg data-mml-node=\"math\" data-latex=\"E\">\u003cg data-mml-node=\"mi\" data-latex=\"E\">\u003cuse data-c=\"1D438\" xlink:href=\"#MJX-7-NCM-I-1D438\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>\u003c/mjx-container> 进行了学习．"}],"html":""},"1.9":{"kind":"para","text":"本书用“模型”泛指从数据中学得的结果.有文献用“模型”指全局性结果（例如一棵决策树），而用“模式”指局部性结果（例如一条规则）.","pages":[1],"sentences":[{"id":"1.9.1","text":"本书用“模型”泛指从数据中学得的结果.","html":"本书用“模型”泛指从数据中学得的结果．"},{"id":"1.9.2","text":"有文献用“模型”指全局性结果（例如一棵决策树），而用“模式”指局部性结果（例如一条规则）.","html":"有文献用“模型”指全局性结果（例如一棵决策树），而用“模式”指局部性结果（例如一条规则）．"}],"html":""},"1.10":{"kind":"note","text":"例如[Hand et al., 2001].","pages":[1],"sentences":[{"id":"1.10.1","text":"例如[Hand et al., 2001].","html":"例如[Hand et al., 2001]."}],"html":""},"1.11":{"kind":"heading","level":2,"text":"1.2 基本术语","pages":[2],"html":"1.2 基本术语"},"1.12":{"kind":"para","text":"要进行机器学习，先要有数据.假定我们收集了一批关于西瓜的数据，例如（色泽=青绿；根蒂=蜷缩；敲声=浊响），（色泽=乌黑；根蒂=稍蜷；敲声=沉闷），（色泽=浅白；根蒂=硬挺；敲声=清脆），……，每对括号内是一条记录，“=”意思是“取值为”.","pages":[2],"sentences":[{"id":"1.12.1","text":"要进行机器学习，先要有数据.","html":"要进行机器学习，先要有数据．"},{"id":"1.12.2","text":"假定我们收集了一批关于西瓜的数据，例如（色泽=青绿；根蒂=蜷缩；敲声=浊响），（色泽=乌黑；根蒂=稍蜷；敲声=沉闷），（色泽=浅白；根蒂=硬挺；敲声=清脆），……，每对括号内是一条记录，“=”意思是“取值为”.","html":"假定我们收集了一批关于西瓜的数据，例如（色泽=青绿；根蒂=蜷缩；敲声=浊响），（色泽=乌黑；根蒂=稍蜷；敲声=沉闷），（色泽=浅白；根蒂=硬挺；敲声=清脆），……，每对括号内是一条记录，“=”意思是“取值为”．"}],"html":""},"1.13":{"kind":"para","text":"这组记录的集合称为一个“数据集”（data set），其中每条记录是关于一个事件或对象（这里是一个西瓜）的描述，称为一个“示例”（instance）或“样本”（sample）.反映事件或对象在某方面的表现或性质的事项，例如“色泽”“根蒂”“敲声”，称为“属性”（attribute）或“特征”（feature）；属性上的取值，例如“青绿”“乌黑”，称为“属性值”（attribute value）.属性张成的空间称为“属性空间”（attribute space）、“样本空间”（sample space）或“输入空间”.例如我们把“色泽”“根蒂”“敲声”作为三个坐标轴，则它们张成一个用于描述西瓜的三维空间，每个西瓜都可在这个空间中找到自己的坐标位置.由于空间中的每个点对应一个坐标向量，因此我们也把一个示例称为一个“特征向量”（feature vector）.","pages":[2],"sentences":[{"id":"1.13.1","text":"这组记录的集合称为一个“数据集”（data set），其中每条记录是关于一个事件或对象（这里是一个西瓜）的描述，称为一个“示例”（instance）或“样本”（sample）.","html":"这组记录的集合称为一个“数据集”（data set），其中每条记录是关于一个事件或对象（这里是一个西瓜）的描述，称为一个“示例”（instance）或“样本”（sample）．"},{"id":"1.13.2","text":"反映事件或对象在某方面的表现或性质的事项，例如“色泽”“根蒂”“敲声”，称为“属性”（attribute）或“特征”（feature）；属性上的取值，例如“青绿”“乌黑”，称为“属性值”（attribute value）.","html":"反映事件或对象在某方面的表现或性质的事项，例如“色泽”“根蒂”“敲声”，称为“属性”（attribute）或“特征”（feature）；属性上的取值，例如“青绿”“乌黑”，称为“属性值”（attribute value）．"},{"id":"1.13.3","text":"属性张成的空间称为“属性空间”（attribute space）、“样本空间”（sample space）或“输入空间”.","html":"属性张成的空间称为“属性空间”（attribute space）、“样本空间”（sample space）或“输入空间”．"},{"id":"1.13.4","text":"例如我们把“色泽”“根蒂”“敲声”作为三个坐标轴，则它们张成一个用于描述西瓜的三维空间，每个西瓜都可在这个空间中找到自己的坐标位置.","html":"例如我们把“色泽”“根蒂”“敲声”作为三个坐标轴，则它们张成一个用于描述西瓜的三维空间，每个西瓜都可在这个空间中找到自己的坐标位置．"},{"id":"1.13.5","text":"由于空间中的每个点对应一个坐标向量，因此我们也把一个示例称为一个“特征向量”（feature vector）.","html":"由于空间中的每个点对应一个坐标向量，因此我们也把一个示例称为一个“特征向量”（feature vector）．"}],"html":""},"1.14":{"kind":"note","text":"有时整个数据集亦称一个“样本”，因为它可看作对样本空间的一个采样；通过上下文可判断出“样本”是指单个示例还是数据集.","pages":[2],"sentences":[{"id":"1.14.1","text":"有时整个数据集亦称一个“样本”，因为它可看作对样本空间的一个采样；通过上下文可判断出“样本”是指单个示例还是数据集.","html":"有时整个数据集亦称一个“样本”，因为它可看作对样本空间的一个采样；通过上下文可判断出“样本”是指单个示例还是数据集．"}],"html":""},"1.15":{"kind":"para","text":"一般地，令 $D=\\{\\boldsymbol{x}_1,\\boldsymbol{x}_2,\\ldots,\\boldsymbol{x}_m\\}$ 表示包含 $m$ 个示例的数据集，每个示例由 $d$ 个属性描述（例如上面的西瓜数据使用了 3 个属性），则每个示例 $\\boldsymbol{x}_i=(x_{i1};x_{i2};\\ldots;x_{id})$ 是 $d$ 维样本空间 $\\mathcal{X}$ 中的一个向量，$\\boldsymbol{x}_i\\in\\mathcal{X}$，其中 $x_{ij}$ 是 $\\boldsymbol{x}_i$ 在第 $j$ 个属性上的取值（例如上述第 3 个西瓜在第 2 个属性上的值是“硬挺”），$d$ 称为样本 $\\boldsymbol{x}_i$ 的“维数”（dimensionality）.","pages":[2],"sentences":[{"id":"1.15.1","text":"一般地，令 $D=\\{\\boldsymbol{x}_1,\\boldsymbol{x}_2,\\ldots,\\boldsymbol{x}_m\\}$ 表示包含 $m$ 个示例的数据集，每个示例由 $d$ 个属性描述（例如上面的西瓜数据使用了 3 个属性），则每个示例 $\\boldsymbol{x}_i=(x_{i1};x_{i2};\\ldots;x_{id})$ 是 $d$ 维样本空间 $\\mathcal{X}$ 中的一个向量，$\\boldsymbol{x}_i\\in\\mathcal{X}$，其中 $x_{ij}$ 是 $\\boldsymbol{x}_i$ 在第 $j$ 个属性上的取值（例如上述第 3 个西瓜在第 2 个属性上的值是“硬挺”），$d$ 称为样本 $\\boldsymbol{x}_i$ 的“维数”（dimensionality）.","html":"一般地，令 \u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1.873ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 828 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cg stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\">\u003cg data-mml-node=\"math\" data-latex=\"D=\\{\\boldsymbol{x}_1,\\boldsymbol{x}_2,\\ldots,\\boldsymbol{x}_m\\}\">\u003cg data-mml-node=\"mi\" data-latex=\"D\">\u003cuse data-c=\"1D437\" xlink:href=\"#MJX-8-NCM-I-1D437\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cpath id=\"MJX-8-NCM-I-1D437\" d=\"M567 683L235 683C212 683 201 682 201 660C201 649 212 644 234 644C254 644 294 647 294 631C294 629 293 623 290 613L158 82C153 60 143 47 128 42C121 40 103 39 72 39C50 39 40 37 40 16C40 5 51 0 72 0L399 0C467 0 532 20 595 61C702 130 804 265 804 429C804 577 713 683 567 683M710 466C710 353 659 216 607 149C550 76 475 39 381 39L270 39C259 39 252 39 248 40C242 40 239 42 239 45C239 47 241 54 244 67L379 610C388 643 387 644 429 644L535 644C647 644 710 578 710 466Z\">\u003c/path>\u003cpath id=\"MJX-8-NCM-N-3D\" d=\"M698 367L80 367C64 367 56 359 56 344C56 329 64 321 80 321L698 321C714 321 722 329 722 344C722 356 711 367 698 367M698 179L80 179C64 179 56 171 56 156C56 141 64 133 80 133L698 133C714 133 722 141 722 156C722 169 711 179 698 179Z\">\u003c/path>\u003cpath id=\"MJX-8-NCM-N-7B\" d=\"M286-122L286 126C286 183 251 225 182 250C251 275 4Z\">\u003c/path>\u003cpath id=\"MJX-19-NCM-I-1D456\" d=\"M284 621C284 648 271 661 244 661C216 661 188 633 188 605C188 578 202 565 229 565C257 565 284 593 284 621M259 138C237 59 205 19 164 19C151 19 144 28 144 47C144 64 173 150 232 306C240 329 244 347 244 360C244 409 210 445 161 445C118 445 84 420 59 369C39 328 29 301 29 288C29 279 34 275 45 275C58 275 60 281 64 295C87 375 118 415 158 415C171 415 178 406 178 387C178 373 175 357 168 338C145 275 121 208 101 155C86 115 78 88 78 74C78 25 114-11 162-11C205-11 239 14 264 64C283 103 293 130 293 145C293 154 288 159 277 159C274 159 259 150 259 138Z\">\u003c/path>\u003c/defs>\u003cg stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\">\u003cg data-mml-node=\"math\" data-latex=\"\\boldsymbol{x}_i\">\u003cg data-mml-node=\"msub\" data-latex=\"\\boldsymbol{x}_i\">\u003cg data-mml-node=\"mi\" data-latex=\"\\boldsymbol{x}\">\u003cuse data-c=\"1D499\" xlink:href=\"#MJX-19-NCM-BI-1D499\">\u003c/use>\u003c/g>\u003cg data-mml-node=\"mi\" transform=\"translate(692,-150) scale(0.707)\" data-latex=\"i\">\u003cuse data-c=\"1D456\" xlink:href=\"#MJX-19-NCM-I-1D456\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>\u003c/mjx-container> 的“维数”（dimensionality）．"}],"html":""},"1.16":{"kind":"para","text":"从数据中学得模型的过程称为“学习”（learning）或“训练”（training），这个过程通过执行某个学习算法来完成.训练过程中使用的数据称为“训练数据”（training data），其中每个样本称为一个“训练样本”（training sample），训练样本组成的集合称为“训练集”（training set）.学得模型对应了关于数据的某种潜在的规律，因此亦称“假设”（hypothesis）；这种潜在规律自身，则称为“真相”或“真实”（ground-truth），学习过程就是为了找出或逼近真相.本书有时将模型称为“学习器”（learner），可看作学习算法在给定数据和参数空间上的实例化.","pages":[2],"sentences":[{"id":"1.16.1","text":"从数据中学得模型的过程称为“学习”（learning）或“训练”（training），这个过程通过执行某个学习算法来完成.","html":"从数据中学得模型的过程称为“学习”（learning）或“训练”（training），这个过程通过执行某个学习算法来完成．"},{"id":"1.16.2","text":"训练过程中使用的数据称为“训练数据”（training data），其中每个样本称为一个“训练样本”（training sample），训练样本组成的集合称为“训练集”（training set）.","html":"训练过程中使用的数据称为“训练数据”（training data），其中每个样本称为一个“训练样本”（training sample），训练样本组成的集合称为“训练集”（training set）．"},{"id":"1.16.3","text":"学得模型对应了关于数据的某种潜在的规律，因此亦称“假设”（hypothesis）；这种潜在规律自身，则称为“真相”或“真实”（ground-truth），学习过程就是为了找出或逼近真相.","html":"学得模型对应了关于数据的某种潜在的规律，因此亦称“假设”（hypothesis）；这种潜在规律自身，则称为“真相”或“真实”（ground-truth），学习过程就是为了找出或逼近真相．"},{"id":"1.16.4","text":"本书有时将模型称为“学习器”（learner），可看作学习算法在给定数据和参数空间上的实例化.","html":"本书有时将模型称为“学习器”（learner），可看作学习算法在给定数据和参数空间上的实例化．"}],"html":""},"1.17":{"kind":"note","text":"训练样本亦称“训练示例”（training instance）或“训练例”.","pages":[2],"sentences":[{"id":"1.17.1","text":"训练样本亦称“训练示例”（training instance）或“训练例”.","html":"训练样本亦称“训练示例”（training instance）或“训练例”．"}],"html":""},"1.18":{"kind":"note","text":"学习算法通常有参数需设置，使用不同的参数值和（或）训练数据，将产生不同的结果.","pages":[2],"sentences":[{"id":"1.18.1","text":"学习算法通常有参数需设置，使用不同的参数值和（或）训练数据，将产生不同的结果.","html":"学习算法通常有参数需设置，使用不同的参数值和（或）训练数据，将产生不同的结果．"}],"html":""},"1.19":{"kind":"para","text":"如果希望学得一个能帮助我们判断没剖开的是不是“好瓜”的模型，仅有前面的示例数据显然是不够的.要建立这样的关于“预测”（prediction）的模型，我们需获得训练样本的“结果”信息，例如“（（色泽=青绿；根蒂=蜷缩；敲声=浊响），好瓜）”.这里关于示例结果的信息，例如“好瓜”，称为“标记”（label）；拥有了标记信息的示例，则称为“样例”（example）.一般地，用$(\\boldsymbol{x}_i,y_i)$ 表示第 $i$ 个样例，其中 $y_i\\in\\mathcal{Y}$ 是示例 $\\boldsymbol{x}_i$ 的标记，$\\mathcal{Y}$ 是所有标记的集合，亦称“标记空间”（label space）或“输出空间”.","pages":[2,3],"sentences":[{"id":"1.19.1","text":"如果希望学得一个能帮助我们判断没剖开的是不是“好瓜”的模型，仅有前面的示例数据显然是不够的.","html":"如果希望学得一个能帮助我们判断没剖开的是不是“好瓜”的模型，仅有前面的示例数据显然是不够的．"},{"id":"1.19.2","text":"要建立这样的关于“预测”（prediction）的模型，我们需获得训练样本的“结果”信息，例如“（（色泽=青绿；根蒂=蜷缩；敲声=浊响），好瓜）”.","html":"要建立这样的关于“预测”（prediction）的模型，我们需获得训练样本的“结果”信息，例如“（（色泽=青绿；根蒂=蜷缩；敲声=浊响），好瓜）”．"},{"id":"1.19.3","text":"这里关于示例结果的信息，例如“好瓜”，称为“标记”（label）；拥有了标记信息的示例，则称为“样例”（example）.","html":"这里关于示例结果的信息，例如“好瓜”，称为“标记”（label）；拥有了标记信息的示例，则称为“样例”（example）．"},{"id":"1.19.4","text":"一般地，用$(\\boldsymbol{x}_i,y_i)$ 表示第 $i$ 个样例，其中 $y_i\\in\\mathcal{Y}$ 是示例 $\\boldsymbol{x}_i$ 的标记，$\\mathcal{Y}$ 是所有标记的集合，亦称“标记空间”（label space）或“输出空间”.","html":"一般地，用\u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: -0.561ex;\" xmlns=\"http://ww ”而非“标签”，是考虑到英文中“label”既可用作名词、也可用作动词.","pages":[2],"sentences":[{"id":"1.20.1","text":"将“label”译为“标记”而非“标签”，是考虑到英文中“label”既可用作名词、也可用作动词.","html":"将“label”译为“标记”而非“标签”，是考虑到英文中“label”既可用作名词、也可用作动词．"}],"html":""},"1.21":{"kind":"note","text":"若将标记看作对象本身的一部分，则“样例”有时也称为“样本”.","pages":[3],"sentences":[{"id":"1.21.1","text":"若将标记看作对象本身的一部分，则“样例”有时也称为“样本”.","html":"若将标记看作对象本身的一部分，则“样例”有时也称为“样本”．"}],"html":""},"1.22":{"kind":"para","text":"若我们欲预测的是离散值，例如“好瓜”“坏瓜”，此类学习任务称为“分类”（classification）；若欲预测的是连续值，例如西瓜成熟度 0.95、0.37，此类学习任务称为“回归”（regression）.对只涉及两个类别的“二分类”（binary classification）任务，通常称其中一个类为“正类”（positive class），另一个类为“反类”（negative class）；涉及多个类别时，则称为“多分类”（multi-class classification）任务.一般地，预测任务是希望通过对训练集 $\\{(\\boldsymbol{x}_1,y_1),(\\boldsymbol{x}_2,y_2),\\ldots,(\\boldsymbol{x}_m,y_m)\\}$ 进行学习，建立一个从输入空间 $\\mathcal{X}$ 到输出空间 $\\mathcal{Y}$ 的映射 $f:\\mathcal{X}\\mapsto\\mathcal{Y}$.对二分类任务，通常令 $\\mathcal{Y}=\\{-1,+1\\}$ 或 $\\{0,1\\}$；对多分类任务，$|\\mathcal{Y}|>2$；对回归任务，$\\mathcal{Y}=\\mathbb{R}$，$\\mathbb{R}$ 为实数集.","pages":[3],"sentences":[{"id":"1.22.1","text":"若我们欲预测的是离散值，例如“好瓜”“坏瓜”，此类学习任务称为“分类”（classification）；若欲预测的是连续值，例如西瓜成熟度 0.95、0.37，此类学习任务称为“回归”（regression）.","html":"若我们欲预测的是离散值，例如“好瓜”“坏瓜”，此类学习任务称为“分类”（classification）；若欲预测的是连续值，例如西瓜成熟度 0.95、0.37，此类学习任务称为“回归”（regression）．"},{"id":"1.22.2","text":"对只涉及两个类别的“二分类”（binary classification）任务，通常称其中一个类为“正类”（positive class），另一个类为“反类”（negative class）；涉及多个类别时，则称为“多分类”（multi-class classification）任务.","html":"对只涉及两个类别的“二分类”（binary classification）任务，通常称其中一个类为“正类”（positive class），另一个类为“反类”（negative class）；涉及多个类别时，则称为“多分类”（multi-class classification）任务．"},{"id":"1.22.3","text":"一般地，预测任务是希望通过对训练集 $\\{(\\boldsymbol{x}_1,y_1),(\\boldsymbol{x}_2,y_2),\\ldots,(\\boldsymbol{x}_m,y_m)\\}$ 进行学习，建立一个从输入空间 $\\mathcal{X}$ 到输出空间 $\\mathcal{Y}$ 的映射 $f:\\mathcal{X}\\mapsto\\mathcal{Y}$.","html":"一般地，预测任务是希望通过对训练集 \u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/20 /g>\u003cg data-mml-node=\"mo\" data-latex=\")\" transform=\"translate(2655.8,0)\">\u003cuse data-c=\"29\" xlink:href=\"#MJX-36-NCM-N-29\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>\u003c/mjx-container>."}],"html":""},"1.25":{"kind":"note","text":"亦称“测试示例”（testing instance）或“测试例”.","pages":[3],"sentences":[{"id":"1.25.1","text":"亦称“测试示例”（testing instance）或“测试例”.","html":"亦称“测试示例”（testing instance）或“测试例”．"}],"html":""},"1.26":{"kind":"para","text":"我们还可以对西瓜做“聚类”（clustering），即将训练集中的西瓜分成若干组，每组称为一个“簇”（cluster）；这些自动形成的簇可能对应一些潜在的概念划分，例如“浅色瓜”“深色瓜”，甚至“本地瓜”“外地瓜”.这样的学习过程有助于我们了解数据内在的规律，能为更深入地分析数据建立基础.需说明的是，在聚类学习中，“浅色瓜”“本地瓜”这样的概念我们事先是不知道的，而且学习过程中使用的训练样本通常不拥有标记信息.","pages":[3],"sentences":[{"id":"1.26.1","text":"我们还可以对西瓜做“聚类”（clustering），即将训练集中的西瓜分成若干组，每组称为一个“簇”（cluster）；这些自动形成的簇可能对应一些潜在的概念划分，例如“浅色瓜”“深色瓜”，甚至“本地瓜”“外地瓜”.","html":"我们还可以对西瓜做“聚类”（clustering），即将训练集中的西瓜分成若干组，每组称为一个“簇”（cluster）；这些自动形成的簇可能对应一些潜在的概念划分，例如“浅色瓜”“深色瓜”，甚至“本地瓜”“外地瓜”．"},{"id":"1.26.2","text":"这样的学习过程有助于我们了解数据内在的规律，能为更深入地分析数据建立基础.","html":"这样的学习过程有助于我们了解数据内在的规律，能为更深入地分析数据建立基础．"},{"id":"1.26.3","text":"需说明的是，在聚类学习中，“浅色瓜”“本地瓜”这样的概念我们事先是不知道的，而且学习过程中使用的训练样本通常不拥有标记信息.","html":"需说明的是，在聚类学习中，“浅色瓜”“本地瓜”这样的概念我们事先是不知道的，而且学习过程中使用的训练样本通常不拥有标记信息．"}],"html":""},"1.27":{"kind":"note","text":"否则标记信息直接形成了簇划分；但也有例外情况，参见 13.6 节.","pages":[3],"sentences":[{"id":"1.27.1","text":"否则标记信息直接形成了簇划分；但也有例外情况，参见 13.6 节.","html":"否则标记信息直接形成了簇划分；但也有例外情况，参见 13.6 节．"}],"html":""},"1.28":{"kind":"para","text":"根据训练数据是否拥有标记信息，学习任务可大致划分为两大类：“监督学习”（supervised learning）和“无监督学习”（unsupervised learning），分类和回归是前者的代表，而聚类则是后者的代表.","pages":[3],"sentences":[{"id":"1.28.1","text":"根据训练数据是否拥有标记信息，学习任务可大致划分为两大类：“监督学习”（supervised learning）和“无监督学习”（unsupervised learning），分类和回归是前者的代表，而聚类则是后者的代表.","html":"根据训练数据是否拥有标记信息，学习任务可大致划分为两大类：“监督学习”（supervised learning）和“无监督学习”（unsupervised learning），分类和回归是前者的代表，而聚类则是后者的代表．"}],"html":""},"1.29":{"kind":"note","text":"亦称“有导师学习”和“无导师学习”.","pages":[3],"sentences":[{"id":"1.29.1","text":"亦称“有导师学习”和“无导师学习”.","html":"亦称“有导师学习”和“无导师学习”．"}],"html":""},"1.30":{"kind":"para","text":"需注意的是，机器学习的目标是使学得的模型能很好地适用于“新样本”，而不是仅仅在训练样本上工作得很好；即便对聚类这样的无监督学习任务，我们也希望学得的簇划分能适用于没在训练集中出现的样本.学得模型适用于新样本的能力，称为“泛化”（generalization）能力.具有强泛化能力的模型能很好地适用于整个样本空间.于是，尽管训练集通常只是样本空间的一个很小的采样，我们仍希望它能很好地反映出样本空间的特性，否则就很难期望在训练集上学得的模型能在整个样本空间上都工作得很好.通常假设样本空间中全体样本服从一个未知“分布”（distribution）$\\mathcal{D}$，我们获得的每个样本都是独立地从这个分布上采样获得的，即“独立同分布”（independent and identically distributed，简称 $i.i.d.$）.一般而言，训练样本越多，我们得到的关于 $\\mathcal{D}$ 的信息越多，这样就越有可能通过学习获得具有强泛化能力的模型.","pages":[3,4],"sentences":[{"id":"1.30.1","text":"需注意的是，机器学习的目标是使学得的模型能很好地适用于“新样本”，而不是仅仅在训练样本上工作得很好；即便对聚类这样的无监督学习任务，我们也希望学得的簇划分能适用于没在训练集中出现的样本.","html":"需注意的是，机器学习的目标是使学得的模型能很好地适用于“新样本”，而不是仅仅在训练样本上工作得很好；即便对聚类这样的无监督学习任务，我们也希望学得的簇划分能适用于没在训练集中出现的样本．"},{"id":"1.30.2","text":"学得模型适用于新样本的能力，称为“泛化”（generalization）能力.","html":"学得模型适用于新样本的能力，称为“泛化”（generalization）能力．"},{"id":"1.30.3","text":"具有强泛化能力的模型能很好地适用于整个样本空间.","html":"具有强泛化能力的模型能很好地适用于整个样本空间．"},{"id":"1.30.4","text":"于是，尽管训练集通常只是样本空间的一个很小的采样，我们仍希望它能很好地反映出样本空间的特性，否则就很难期望在训练集上学得的模型能在整个样本空间上都工作得很好.","html":"于是，尽管训练集通常只是样本空间的一个很小的采样，我们仍希望它能很好地反映出样本空间的特性，否则就很难期望在训练集上学得的模型能在整个样本空间上都工作得很好．"},{"id":"1.30.5","text":"通常假设样本空间中全体样本服从一个未知“分布”（distribution）$\\mathcal{D}$，我们获得的每个样本都是独立地从这个分布上采样获得的，即“独立同分布”（independent and identically distributed，简称 $i.i.d.$）.","html":"通常假设样本空间中全体样本服从一个未知“分布”（distribution）\u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: 0.009ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1.971ex\" height=\"1.613ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -717 871 713\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cdefs>\u003cpath id=\"MJX-37-NCM-C-44\" d=\"M332 4C441 4 543 42 636 117C729 192 790 284 817 391C826 428 831 462 831 491C831 579 784 638 689 668C647 681 587 688 509 688L515 710L505 717L435 685C344 679 268 651 205 601C165 569 140 532 129 489C120 453 124 421 155 421C166 421 177 427 190 438C203 449 211 470 214 502C217 541 230 570 255 589C304 628 360 te(500,0)\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>\u003c/mjx-container>）．"}],"html":""},"1.33":{"kind":"heading","level":2,"text":"1.3 假设空间","pages":[4],"html":"1.3 假设空间"},"1.34":{"kind":"para","text":"归纳（induction）与演绎（deduction）是科学推理的两大基本手段.前者是从特殊到一般的“泛化”（generalization）过程，即从具体的事实归结出一般性规律；后者则是从一般到特殊的“特化”（specialization）过程，即从基础原理推演出具体状况.例如，在数学公理系统中，基于一组公理和推理规则推导出与之相洽的定理，这是演绎；而“从样例中学习”显然是一个归纳的过程，因此亦称“归纳学习”（inductive learning）.","pages":[4],"sentences":[{"id":"1.34.1","text":"归纳（induction）与演绎（deduction）是科学推理的两大基本手段.","html":"归纳（induction）与演绎（deduction）是科学推理的两大基本手段．"},{"id":"1.34.2","text":"前者是从特殊到一般的“泛化”（generalization）过程，即从具体的事实归结出一般性规律；后者则是从一般到特殊的“特化”（specialization）过程，即从基础原理推演出具体状况.","html":"前者是从特殊到一般的“泛化”（generalization）过程，即从具体的事实归结出一般性规律；后者则是从一般到特殊的“特化”（specialization）过程，即从基础原理推演出具体状况．"},{"id":"1.34.3","text":"例如，在数学公理系统中，基于一组公理和推理规则推导出与之相洽的定理，这是演绎；而“从样例中学习”显然是一个归纳的过程，因此亦称“归纳学习”（inductive learning）.","html":"例如，在数学公理系统中，基于一组公理和推理规则推导出与之相洽的定理，这是演绎；而“从样例中学习”显然是一个归纳的过程，因此亦称“归纳学习”（inductive learning）．"}],"html":""},"1.35":{"kind":"para","text":"归纳学习有狭义与广义之分，广义的归纳学习大体相当于从样例中学习，而狭义的归纳学习则要求从训练数据中学得概念（concept），因此亦称为“概念学习”或“概念形成”.概念学习技术目前研究、应用都比较少，因为要学得泛化性能好且语义明确的概念实在太困难了，现实常用的技术大多是产生“黑箱”模型.然而，对概念学习有所了解，有助于理解机器学习的一些基础思想.","pages":[4],"sentences":[{"id":"1.35.1","text":"归纳学习有狭义与广义之分，广义的归纳学习大体相当于从样例中学习，而狭义的归纳学习则要求从训练数据中学得概念（concept），因此亦称为“概念学习”或“概念形成”.","html":"归纳学习有狭义与广义之分，广义的归纳学习大体相当于从样例中学习，而狭义的归纳学习则要求从训练数据中学得概念（concept），因此亦称为“概念学习”或“概念形成”．"},{"id":"1.35.2","text":"概念学习技术目前研究、应用都比较少，因为要学得泛化性能好且语义明确的概念实在太困难了，现实常用的技术大多是产生“黑箱”模型.","html":"概念学习技术目前研究、应用都比较少，因为要学得泛化性能好且语义明确的概念实在太困难了，现实常用的技术大多是产生“黑箱”模型．"},{"id":"1.35.3","text":"然而，对概念学习有所了解，有助于理解机器学习的一些基础思想.","html":"然而，对概念学习有所了解，有助于理解机器学习的一些基础思想．"}],"html":""},"1.36":{"kind":"para","text":"概念学习中最基本的是布尔概念学习，即对“是”“不是”这样的可表示为 0/1 布尔值的目标概念的学习.举一个简单的例子，假定我们获得了这样一个训练数据集：","pages":[4],"sentences":[{"id":"1.36.1","text":"概念学习中最基本的是布尔概念学习，即对“是”“不是”这样的可表示为 0/1 布尔值的目标概念的学习.","html":"概念学习中最基本的是布尔概念学习，即对“是”“不是” ersion space）.","html":"需注意的是，现实问题中我们常面临很大的假设空间，但学习过程是基于有限样本训练集进行的，因此，可能有多个假设与训练集一致，即存在着一个与训练集一致的“假设集合”，我们称之为“版本空间”（version space）．"},{"id":"1.47.2","text":"例如，在西瓜问题中，与表 1.1 训练集所对应的版本空间如图 1.2 所示.","html":"例如，在西瓜问题中，与表 1.1 训练集所对应的版本空间如图 1.2 所示．"}],"html":""},"1.48":{"kind":"figure","image":"p-006","box":{"x":813,"y":146,"w":1092,"h":194},"text":"图1.2 西瓜问题的版本空间","pages":[6],"erratum_note":"图中两处“清脆”应为“浊响”","html":"\u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABGwAAADqCAIAAAB4NETdAAAAAXNSR0IArs4c6QAAAHhlWElmTU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAAEsAAAAAQAAASwAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAABGygAwAEAAAAAQAAAOoAAAAAmbkMNgAAAAlwSFlzAAAuIwAALiMBeKU/dgAAQABJREFUeAHtnWu64zaSbcv91bxcHlmVR2Z7ZL4rc1fvjguQEEhREklt/qCDgXgugC9JJ/3L33///Y9sIRACIRACIRACIRACIRACIRACcwT+Z84sViEQAiEQAiEQAiEQAiEQAiEQAj8I5CUq6yAEQiAEQiAEQiAEQiAEQiAENhDIS9QGWDENgRAIgRAIgRAIgRAIgRAIgbxEZQ2EQAiEQAiEQAiEQAiEQAiEwAYCeYnaACumIRACIRACIRACIRACIRACIZCXqKyBEAiBEAiBEAiBFxL4888/Xxg9oUMgBELgEwR+yT9x/gnsyRkCIRACIRACIRACIRACIXBVAvkm6qozl7pDIARCIARCIARCIARCIAQ+QiAvUR/BnqQhEAIhEAIhEAIhEAIhEAJXJZCXqKvOXOoOgRAIgRAIgRAIgRAIgRD4CIG8RH0Ee5KGQAiEQAiEQAiEQAiEQAhclUBeoq46c6k7BEIgBEIgBEIgBEIgBELgIwTyEvUR7EkaAiEQAiEQAiEQAiEQAiFwVQJ5ibrqzKXuEAiBEAiBEAiBEAiBEAiBjxDIS9RHsCdpCIRACIRACIRACIRACITAVQnkJeqqM5e6QyAEQiAEQiAEQiAEQiAEPkIgL1EfwZ6kIRACIRACIRACIRACIRACVyWQl6irzlzqDoEQCIEQCIEQCIEQCIEQ+AiBvER9BHuShkAIhEAIhEAIhEAI3JDAn3/+ecOu0lJHIC9RHZIoQiAEQiAEQiAEQiAEQiAEQmCdQF6i1tlkJARCIARCIARCIARC4OIE3vzV0L/+9a+LA0v5UwR++fvvv6cMYxQCIRACIRACIRACIRACIRACIfCPf+SbqKyCEAiBEAiBEAiBEAiBEAiBENhAIC9RG2DFNARC4FgC//nPf44NmGghEAIhEAIhEAIh8AYC+TnfGyAnRQiEQAiEQAiEQAiEQAiEwH0I/PM+rWzpJJ9/b6EV2xC4JAH+tDd/3XvJmftE0bkpfIJ6coZACITAJQnoAeNN30Sd5/70+++/X3K6UnQIhEAI3I7Aef5lo19++eV2dNNQCIRACITASwj8+9//5tXmTd9E5dXlJXOYoCEQAiEQAiEQAiEQAiEQAm8n8KaXqLf31SY8z+edbWU5DoEQCIGTEXjDbwfO+cla7hQnW4kpZw8B/p9Ib/7fIu2pMj4hcE0CnFx//fWXan/Tz/n0S4ncn665YFJ1CIRACBxM4Gw3hbPVczDuhAuBEAiBEDiCAB8y8iGgfs6Xf+L8CKKJEQIhEAIhEAI tp://www.w3.org/2000/svg\" width=\"1.509ex\" height=\"1.407ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -602 667 622\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cdefs>\u003cpath id=\"MJX-66-NCM-N-2227\" d=\"M574-20C590-20 605-5 597 13L357 586C353 597 345 602 334 602C323 602 315 597 311 586L71 13C70 10 69 6 69 2C69-13 77-20 93-20C103-20 110-15 114-6L334 519L553-6C557-15 564-20 574-20Z\">\u003c/path>\u003c/defs>\u003cg stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\">\u003cg data-mml-node=\"math\" data-latex=\"\\wedge\">\u003cg data-mml-node=\"mo\" data-latex=\"\\wedge\">\u003cuse data-c=\"2227\" xlink:href=\"#MJX-66-NCM-N-2227\">\u003c/use>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>\u003c/mjx-container>（敲声=*）”．"},{"id":"1.51.5","text":"机器学习算法在学习过程中对某种类型假设的偏好，称为“归纳偏好”（inductive bias），或简称为“偏好”.","html":"机器学习算法在学习过程中对某种类型假设的偏好，称为“归纳偏好”（inductive bias），或简称为“偏好”．"}],"html":""},"1.52":{"kind":"note","text":"尽可能特殊即“适用情形尽可能少”；尽可能一般即“适用情形尽可能多”.","pages":[6],"sentences":[{"id":"1.52.1","text":"尽可能特殊即“适用情形尽可能少”；尽可能一般即“适用情形尽可能多”.","html":"尽可能特殊即“适用情形尽可能少”；尽可能一般即“适用情形尽可能多”．"}],"html":""},"1.53":{"kind":"note","text":"对“根蒂”还是对“敲声”更重视，看起来和属性选择，亦称“特征选择”（feature selection）有关，但需注意的是，机器学习中的特征选择仍是基于对训练样本的分析进行的，而在此处我们并非基于特征选择做出对“根蒂”的重视；这里对“根蒂”的信赖可视为基于某种领域知识而产生的归纳偏好.关于特征选择方面的内容参见第 11 章.","pages":[6],"sentences":[{"id":"1.53.1","text":"对“根蒂”还是对“敲声”更重视，看起来和属性选择，亦称“特征选择”（feature selection）有关，但需注意的是，机器学习中的特征选择仍是基于对训练样本的分析进行的，而在此处我们并非基于特征选择做出对“根蒂”的重视；这里对“根蒂”的信赖可视为基于某种领域知识而产生的归纳偏好.","html":"对“根蒂”还是对“敲声”更重视，看起来和属性选择，亦称“特征选择”（feature selection）有关，但需注意的是，机器学习中的特征选择仍是基于对训练样本的分析进行的，而在此处我们并非基于特征选择做出对“根蒂”的重视；这里对“根蒂”的信赖可视为基于某种领域知识而产生的归纳偏好．"},{"id":"1.53.2","text":"关于特征选择方面的内容参见第 11 章.","html":"关于特征选择方面的内容参见第 11 章．"}],"html":""},"1.54":{"kind":"para","text":"任何一个有效的机器学习算法必有其归纳偏好，否则它将被假设空间中看似在训练集上“等效”的假设所迷惑，而无法产生确定的学习结果.可以想象，如果没有偏好，我们的西瓜学习算法产生的模型每次在进行预测时随机抽选训练集上的等效假设，那么对这个新瓜“（色泽=青绿；根蒂=蜷缩；敲声=沉闷）”，学得模型时而告诉我们它是好的、时而告诉我们它是不好的，这样的学习结果显然没有意义.","pages":[6],"sentences":[{"id":"1.54.1","text":"任何一个有效的机器学习算法必有其归纳偏好，否则它将被假设空间中看似在训练集上“等效”的假设所迷惑，而无法产生确定的学习结果.","html":"任何一个有效的机器学习算法必有其归纳偏好，否则它将被假设空间中看似在训练集上“等效”的假设所迷惑，而无法产生确定的学习结果．"},{"id":"1.54.2","text":"可以想象，如果没有偏好，我们的西瓜学习算法产生的模型每次在进行预测时随机抽选训练集上的等效假设，那么对这个新瓜“（色泽=青绿；根蒂=蜷缩；敲声=沉闷）”，学得模型时而告诉我们它是好的、时而告诉我们它是不好的，这样的学习结果显然没有意义.","html":"可以想象，如果没有偏好，我们的西瓜学习算法产生的模型每次在进行预测时随机抽选训练集上的等效假设，那么对这个新瓜“（色泽=青绿；根蒂=蜷缩；敲声=沉闷）”，学得模型时而告诉我们它是好的、时而告诉我们它是不好的，这样的学习结果显然没有意义．"}],"html":""},"1.55":{"kind":"para","text":"归纳偏好的作用在图 1.3 这个回归学习图示中可能更直观.这里的每个训练样本是图中的一个点 $(x,y)$，要学得一个与训练集一致的模型，相当于找到一条穿过所有训练样本点的曲线.显然，对有限个样本点组成的训练集，存在着很多条曲线与其一致.我们的学习算法必须有某种偏好，才能产出它认为“正确”的模型.例如，若认为相似的样本应有相似的输出（例如，在各种属性上都很相像的西瓜，成熟程度应该比较接近），则对应的学习算法可能偏好图 1.3 中比较“平滑”的曲线 A 而不是比较“崎岖”的曲线 B.","pages":[6,7],"sentences":[{"id":"1.55.1","text":"归纳偏好的作用在图 1.3 这个回归学习图示中可能更直观.","html":"归纳偏好的作用在图 1.3 这个回归学习图示中可能更直观．"},{"id":"1.55.2","text":"这里的每个训练样本是图中的一个点 $(x,y)$，要学得一个与训练集一致的模型，相当于找到一条穿过所有训练样本点的曲线.","html":"这里的每个训练样本是图中的一个点 \u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: -0.561ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"5.169ex\" height=\"2.253ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -748 2284.7 996\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cdefs>\u003cpath id=\"MJX-67-NCM-N-28\" d=\"M318-248C327-248 332-243 332-234C332-231 330-227 327-223C275-183 233-117 202-26C175 53 161 131 161 208L161 292C161 369 175 447 202 526C233 617 275 683 327 723C330 726 332 730 332 734C332 743 327 748 318 748C317 748 314 747 311 745C251 699 201 631 160 540C121 453 101 371 101 292L101 208C101 129 121 47 160-40C201-131 251-199 311-245C314-247 317-248 318-248Z\">\u003c/path>\u003cpath id=\"MJX-67-NCM-I-1D465\" d=\"M527 373C527 419 482 442 432 442C389 442 355 419 329 373C308 419 273 442 222 442C173 442 133 419 101 374C74 335 60 306 60 287C60 278 65 273 75 273C84 273 90 278 92 287C111 345 153 413 220 413C253 413 269 392 269 351C269 330 251 252 216 118C199 51 169 18 126 18C112 18 99 21 88 26C ,"html":""},"1.70":{"kind":"para","text":"这下子，读者对机器学习的热情可能被一盆冷水浇透了：既然所有学习算法的期望性能都跟随机胡猜差不多，那还有什么好学的？","pages":[9],"sentences":[{"id":"1.70.1","text":"这下子，读者对机器学习的热情可能被一盆冷水浇透了：既然所有学习算法的期望性能都跟随机胡猜差不多，那还有什么好学的？","html":"这下子，读者对机器学习的热情可能被一盆冷水浇透了：既然所有学习算法的期望性能都跟随机胡猜差不多，那还有什么好学的？"}],"html":""},"1.71":{"kind":"para","text":"我们需注意到，NFL 定理有一个重要前提：所有“问题”出现的机会相同、或所有问题同等重要.但实际情形并不是这样.很多时候，我们只关注自己正在试图解决的问题（例如某个具体应用任务），希望为它找到一个解决方案，至于这个解决方案在别的问题、甚至在相似的问题上是否为好方案，我们并不关心.例如，为了快速从 A 地到达 B 地，如果我们正在考虑的 A 地是南京鼓楼、B 地是南京新街口，那么“骑自行车”是很好的解决方案；这个方案对 A 地是南京鼓楼、B 地是北京新街口的情形显然很糟糕，但我们对此并不关心.","pages":[9],"sentences":[{"id":"1.71.1","text":"我们需注意到，NFL 定理有一个重要前提：所有“问题”出现的机会相同、或所有问题同等重要.","html":"我们需注意到，NFL 定理有一个重要前提：所有“问题”出现的机会相同、或所有问题同等重要．"},{"id":"1.71.2","text":"但实际情形并不是这样.","html":"但实际情形并不是这样．"},{"id":"1.71.3","text":"很多时候，我们只关注自己正在试图解决的问题（例如某个具体应用任务），希望为它找到一个解决方案，至于这个解决方案在别的问题、甚至在相似的问题上是否为好方案，我们并不关心.","html":"很多时候，我们只关注自己正在试图解决的问题（例如某个具体应用任务），希望为它找到一个解决方案，至于这个解决方案在别的问题、甚至在相似的问题上是否为好方案，我们并不关心．"},{"id":"1.71.4","text":"例如，为了快速从 A 地到达 B 地，如果我们正在考虑的 A 地是南京鼓楼、B 地是南京新街口，那么“骑自行车”是很好的解决方案；这个方案对 A 地是南京鼓楼、B 地是北京新街口的情形显然很糟糕，但我们对此并不关心.","html":"例如，为了快速从 A 地到达 B 地，如果我们正在考虑的 A 地是南京鼓楼、B 地是南京新街口，那么“骑自行车”是很好的解决方案；这个方案对 A 地是南京鼓楼、B 地是北京新街口的情形显然很糟糕，但我们对此并不关心．"}],"html":""},"1.72":{"kind":"para","text":"事实上，上面 NFL 定理的简短论述过程中假设了 $f$ 的均匀分布，而实际情形并非如此.例如，回到我们熟悉的西瓜问题，考虑 {假设 1：好瓜 $\\leftrightarrow$（色泽=$*$）$\\wedge$（根蒂=蜷缩）$\\wedge$（敲声=浊响）} 和 {假设 2：好瓜 $\\leftrightarrow$（色泽=$*$）$\\wedge$（根蒂=硬挺）$\\wedge$（敲声=清脆）}.从 NFL 定理可知，这两个假设同样好.我们立即会想到符合条件的例子，对好瓜（色泽=青绿；根蒂=蜷缩；敲声=浊响）是假设 1 更好，而对好瓜（色泽=乌黑；根蒂=硬挺；敲声=清脆）则是假设 2 更好.看上去的确是这样.然而需注意到，“（根蒂=蜷缩；敲声=浊响）”的好瓜很常见，而“（根蒂=硬挺；敲声=清脆）”的好瓜罕见，甚至不存在.","pages":[9],"sentences":[{"id":"1.72.1","text":"事实上，上面 NFL 定理的简短论述过程中假设了 $f$ 的均匀分布，而实际情形并非如此.","html":"事实上，上面 NFL 定理的简短论述过程中假设了 \u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\">\u003csvg style=\"vertical-align: -0.464ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1.249ex\" height=\"2.059ex\" role=\"img\" focusable=\"false\" vi L 定理可知，这两个假设同样好．"},{"id":"1.72.3","text":"我们立即会想到符合条件的例子，对好瓜（色泽=青绿；根蒂=蜷缩；敲声=浊响）是假设 1 更好，而对好瓜（色泽=乌黑；根蒂=硬挺；敲声=清脆）则是假设 2 更好.","html":"我们立即会想到符合条件的例子，对好瓜（色泽=青绿；根蒂=蜷缩；敲声=浊响）是假设 1 更好，而对好瓜（色泽=乌黑；根蒂=硬挺；敲声=清脆）则是假设 2 更好．"},{"id":"1.72.4","text":"看上去的确是这样.","html":"看上去的确是这样．"},{"id":"1.72.5","text":"然而需注意到，“（根蒂=蜷缩；敲声=浊响）”的好瓜很常见，而“（根蒂=硬挺；敲声=清脆）”的好瓜罕见，甚至不存在.","html":"然而需注意到，“（根蒂=蜷缩；敲声=浊响）”的好瓜很常见，而“（根蒂=硬挺；敲声=清脆）”的好瓜罕见，甚至不存在．"}],"html":""},"1.73":{"kind":"para","text":"所以，NFL 定理最重要的寓意，是让我们清楚地认识到，脱离具体问题，空泛地谈论“什么学习算法更好”毫无意义，因为若考虑所有潜在的问题，则所有学习算法都一样好.要谈论算法的相对优劣，必须要针对具体的学习问题；在某些问题上表现好的学习算法，在另一些问题上却可能不尽如人意，学习算法自身的归纳偏好与问题是否相配，往往会起到决定性的作用.","pages":[9],"sentences":[{"id":"1.73.1","text":"所以，NFL 定理最重要的寓意，是让我们清楚地认识到，脱离具体问题，空泛地谈论“什么学习算法更好”毫无意义，因为若考虑所有潜在的问题，则所有学习算法都一样好.","html":"所以，NFL 定理最重要的寓意，是让我们清楚地认识到，脱离具体问题，空泛地谈论“什么学习算法更好”毫无意义，因为若考虑所有潜在的问题，则所有学习算法都一样好．"},{"id":"1.73.2","text":"要谈论算法的相对优劣，必须要针对具体的学习问题；在某些问题上表现好的学习算法，在另一些问题上却可能不尽如人意，学习算法自身的归纳偏好与问题是否相配，往往会起到决定性的作用.","html":"要谈论算法的相对优劣，必须要针对具体的学习问题；在某些问题上表现好的学习算法，在另一些问题上却可能不尽如人意，学习算法自身的归纳偏好与问题是否相配，往往会起到决定性的作用．"}],"html":""},"1.74":{"kind":"heading","level":2,"text":"1.5 发展历程","pages":[10],"html":"1.5 发展历程"},"1.75":{"kind":"para","text":"机器学习是人工智能（artificial intelligence）研究发展到一定阶段的必然产物.二十世纪五十年代到七十年代初，人工智能研究处于“推理期”，那时人们以为只要能赋予机器逻辑推理能力，机器就能具有智能.这一阶段的代表性工作主要有 A. Newell 和 H. Simon 的“逻辑理论家”（Logic Theorist）程序以及此后的“通用问题求解”（General Problem Solving）程序等，这些工作在当时取得了令人振奋的结果.例如，“逻辑理论家”程序在 1952 年证明了著名数学家罗素和怀特海的名著《数学原理》中的 38 条定理，在 1963 年证明了全部 52 条定理，特别值得一提的是，定理 2.85 甚至比罗素和怀特海证明得更巧妙.A. Newell 和 H. Simon 因为这方面的工作获得了 1975 年图灵奖.然而，随着研究向前发展，人们逐渐认识到，仅具有逻辑推理能力是远远实现不了人工智能的.E. A. Feigenbaum 等人认为，要使机器具有智能，就必须设法使机器拥有知识.在他们的倡导下，从二十世纪七十年代中期开始，人工智能研究进入了“知识期”.在这一时期，大量专家系统问世，在很多应用领域取得了大量成果.E. A. Feigenbaum 作为“知识工程”之父在 1994 年获得图灵奖.但是，人们逐渐认识到，专家系统面临“知识工程瓶颈”，简单地说，就是由人来把知识总结出来再教给计算机是相当困难的.于是，一些学者想到，如果机器自己能够学习知识该多好！","pages":[10],"sentences":[{"id":"1.75.1","text":"机器学习是人工智能（artificial intelligence）研究发展到一定阶段的必然产物.","html":"机器学习是人工智能（artificial intelligence）研究发展到一定阶段的必然产物．"},{"id":"1.75.2","text":"二十世纪五十年代到七十年代初，人工智能研究处于“推理期”，那时人们以为只要能赋予机器逻辑推理能力，机器就能具有智能.","html":"二十世纪五十年代到七十年代初，人工智能研究处于“推理期”，那时人们以为只要能赋予机器逻辑推理能力，机器就能具有智能．"},{"id":"1.75.3","text":"这一阶段的代表性工作主要有 A. Newell 和 H. Simon 的“逻辑理论家”（Logic Theorist）程序以及此后的“通用问题求解”（General Problem Solving）程序等，这些工作在当时取得了令人振奋的结果.","html":"这一阶段的代表性工作主要有 A. Newell 和 H. Simon 的“逻辑理论家”（Logic Theorist）程序以及此后的“通用问题求解”（General Problem Solving）程序等，这些工作在当时取得了令人振奋的结果．"},{"id":"1.75.4","text":"例如，“逻辑理论家”程序在 1952 年证明了著名数学家罗素和怀特海的名著《数学原理》中的 38 条定理，在 1963 年证明了全部 52 条定理，特别值得一提的是，定理 2.85 甚至比罗素和怀特海证明得更巧妙.","html":"例如，“逻辑理论家”程序在 1952 年证明了著名数学家罗素和怀特海的名著《数学原理》中的 38 条定理，在 1963 年证明了全部 52 条定理，特别值得一提的是，定理 2.85 甚至比罗素和怀特海证明得更巧妙．"},{"id":"1.75.5","text":"A. Newell 和 H. Simon 因为这方面的工作获得了 1975 年图灵奖.","html":"A. Newell 和 H. Simon 因为这方面的工作获得了 1975 年图灵奖．"},{"id":"1.75.6","text":"然而，随着研究向前发展，人们逐渐认识到，仅具有逻辑推理能力是远远实现不了人工智能的.","html":"然而，随着研究向前发展，人们逐渐认识到，仅具有逻辑推理能力是远远实现不了人工智能的．"},{"id":"1.75.7","text":"E. A. Feigenbaum 等人认为，要使机器具有智能，就必须设法使机器拥有知识.","html":"E. A. Feigenbaum 等人认为，要使机器具有智能，就必须设法使机器拥有知识．"},{"id":"1.75.8","text":"在他们的倡导下，从二十世纪七十年代中期开始，人工智能研究进入了“知识期”.","html":"在他们的倡导下，从二十世纪七十年代中期开始，人工智能研究进入了“知识期”．"},{"id":"1.75.9","text":"在这一时期，大量专家系统问世，在很多应用领域取得了大量成果.","html":"在这一时期，大量专家系统问世，在很多应用领域取得了大量成果．"},{"id":"1.75.10","text":"E. A. Feigenbaum 作为“知识工程”之父在 1994 年获得图灵奖.","html":"E. A. Feigenbaum 作为“知识工程”之父在 1994 年获得图灵奖．"},{"id":"1.75.11","text":"但是，人们逐渐认识到，专家系统面临“知识工程瓶颈”，简单地说，就是由人来把知识总结出来再教给计算机是相当困难的.","html":"但是，人们逐渐认识到，专家系统面临“知识工程瓶颈”，简单地说，就是由人来把知识总结出来再教给计算机是相当困难的．"},{"id":"1.75.12","text":"于是，一些学者想到，如果机器自己能够学习知识该多好！","html":"于是，一些学者想到，如果机器自己能够学习知识该多好！"}],"html":""},"1.76":{"kind":"note","text":"所谓“知识就是力量”.","pages":[10],"sentences":[{"id":"1.76.1","text":"所谓“知识就是力量”.","html":"所谓“知识就是力量”．"}],"html":""},"1.77":{"kind":"note","text":"1965 年，Feigenbaum 主持研制了世界上第一个专家系统 DENDRAL.","pages":[10],"sentences":[{"id":"1.77.1","text":"1965 年，Feigenbaum 主持研制了世界上第一个专家系统 DENDRAL.","html":"1965 年，Feigenbaum 主持研制了世界上第一个专家系统 DENDRAL."}],"html":""},"1.78":{"kind":"para","text":"事实上，图灵在 1950 年关于图灵测试的文章中，就曾提到了机器学习的可能；二十世纪五十年代初已有机器学习的相关研究，例如 A. Samuel 著名的跳棋程序.五十年代中后期，基于神经网络的“连接主义”（connectionism）学习开始出现，代表性工作有 F. Rosenblatt 的感知机（Perceptron）、B. Widrow 的 Adaline 等.在六七十年代，基于逻辑表示的“符号主义”（symbolism）学习技术蓬勃发展，代表性工作有 P. Winston 的“结构学习系统”、R. S. Michalski 等人的“基于逻辑的归纳学习系统”、E. B. Hunt 等人的“概念学习系统”等；以决策理论为基础的学习技术以及强化学习技术等也得到发展，代表性工作有 N. J. Nilsson 的“学习机器”等；二十多年后红极一时的统计学习理论的一些奠基性结果也是在这个时期取得的.","pages":[10],"errata":[{"was":"Nilson","now":"Nilsson"}],"sentences":[{"id":"1.78.1","text":"事实上，图灵在 1950 年关于图灵测试的文章中，就曾提到了机器学习的可能；二十世纪五十年代初已有机器学习的相关研究，例如 A. Samuel 著名的跳棋程序.","html":"事实上，图灵在 1950 年关于图灵测试的文章中，就曾提到了机器学习的可能；二十世纪五十年代初已有机器学习的相关研究，例如 A. Samuel 著名的跳棋程序．"},{"id":"1.78.2","text":"五十年代中后期，基于神经网络的“连接主义”（connectionism）学习开始出现，代表性工作有 F. Rosenblatt 的感知机（Perceptron）、B. Widrow 的 Adaline 等.","html":"五十年代中后期，基于神经网络的“连接主义”（connectionism）学习开始出现，代表性工作有 F. Rosenblatt 的感知机（Perceptron）、B. Widrow 的 Adaline 等．"},{"id":"1.78.3","text":"在六七十年代，基于逻辑表示的“符号主义”（symbolism）学习技术蓬勃发展，代表性工作有 P. Winston 的“结构学习系统”、R. S. Michalski 等人的“基于逻辑的归纳学习系统”、E. B. Hunt 等人的“概念学习系统”等；以决策理论为基础的学习技术以及强化学习技术等也得到发展，代表性工作有 N. J. Nilsson 的“学习机器”等；二十多年后红极一时的统计学习理论的一些奠基性结果也是在这个时期取得的.","html":"在六七十年代，基于逻辑表示的“符号主义”（symbolism）学习技术蓬勃发展，代表性工作有 P. Winston 的“结构学习系统”、R. S. Michalski 等人的“基于逻辑的归纳学习系统”、E. B. Hunt 等人的“概念学习系统”等；以决策理论为基础的学习技术以及强化学习技术等也得到发展，代表性工作有 N. J. Nilsson 的“学习机器”等；二十多年后红极一时的统计学习理论的一些奠基性结果也是在这个时期取得的．\u003cspan class=\"erratum\">［按作者勘误，原印为“Nilson”］\u003c/span>"}],"html":""},"1.79":{"kind":"note","text":"参见 p.22.","pages":[10],"sentences":[{"id":"1.79.1","text":"参见 p.22.","html":"参见 p.22."}],"html":""},"1.80":{"kind":"para","text":"1980 年夏，在美国卡耐基梅隆大学举行了第一届机器学习研讨会（IWML）；同年，《策略分析与信息系统》连出三期机器学习专辑；1983 年，Tioga 出版社出版了 R. S. Michalski、J. G. Carbonell 和 T. Mitchell 主编的《机器学习：一种人工智能途径》[Michalski et al., 1983]，对当时的机器学习研究工作进行了总结；1986 年，第一本机器学习专业期刊 Machine Learning 创刊；1989 年，人工智能领域的权威期刊 Artificial Intelligence 出版机器学习专辑，刊发了当时一些比较活跃的研究工作，其内容后来出现在 J. G. Carbonell 主编、MIT 出版社 1990 年的《机器学习：范型与方法》[Carbonell, 1990] 一书中.总的来看，二十世纪八十年代是机器学习成为一个独立的学科领域、各种机器学习技术百花初绽的时期.","pages":[10,11],"sentences":[{"id":"1.80.1","text":"1980 年夏，在美国卡耐基梅隆大学举行了第一届机器学习研讨会（IWML）；同年，《策略分析与信息系统》连出三期机器学习专辑；1983 年，Tioga 出版社出版了 R. S. Michalski、J. G. Carbonell 和 T. Mitchell 主编的《机器学习：一种人工智能途径》[Michalski et al., 1983]，对当时的机器学习研究工作进行了总结；1986 年，第一本机器学习专业期刊 Machine Learning 创刊；1989 年，人工智能领域的权威期刊 Artificial Intelligence 出版机器学习专辑，刊发了当时一些比较活跃的研究工作，其内容后来出现在 J. G. Carbonell 主编、MIT 出版社 1990 年的《机器学习：范型与方法》[Carbonell, 1990] 一书中.","html":"1980 年夏，在美国卡耐基梅隆大学举行了第一届机器学习研讨会（IWML）；同年，《策略分析与信息系统》连出三期机器学习专辑；1983 年，Tioga 出版社出版了 R. S. Michalski、J. G. Carbonell 和 T. Mitchell 主编的《机器学习：一种人工智能途径》[Michalski et al., 1983]，对当时的机器学习研究工作进行了总结；1986 年，第一本机器学习专业期刊 Machine Learning 创刊；1989 年，人工智能领域的权威期刊 Artificial Intelligence 出版机器学习专辑，刊发了当时一些比较活跃的研究工作，其内容后来出现在 J. G. Carbonell 主编、MIT 出版社 1990 年的《机器学习：范型与方法》[Carbonell, 1990] 一书中．"},{"id":"1.80.2","text":"总的来看，二十世纪八十年代是机器学习成为一个独立的学科领域、各种机器学习技术百花初绽的时期.","html":"总的来看，二十世纪八十年代是机器学习成为一个独立的学科领域、各种机器学习技术百花初绽的时期．"}],"html":""},"1.81":{"kind":"note","text":"IWML 后来发展为国际机器学习会议 ICML.","pages":[10],"sentences":[{"id":"1.81.1","text":"IWML 后来发展为国际机器学习会议 ICML.","html":"IWML 后来发展为国际机器学习会议 ICML."}],"html":""},"1.82":{"kind":"para","text":"R. S. Michalski 等人 [Michalski et al., 1983] 把机器学习研究划分为“从样例中学习”“在问题求解和规划中学习”“通过观察和发现学习”“从指令中学习”等种类；E. A. Feigenbaum 等人在著名的《人工智能手册》（第三卷）[Cohen and Feigenbaum, 1983] 中，则把机器学习划分为“机械学习”“示教学习”“类比学习”和“归纳学习”.机械学习亦称“死记硬背式学习”，即把外界输入的信息全部记录下来，在需要时原封不动地取出来使用，这实际上没有进行真正的学习，仅是在进行信息存储与检索；示教学习和类比学习类似于 R. S. Michalski 等人所说的“从指令中学习”和“通过观察和发现学习”；归纳学习相当于“从样例中学习”，即从训练样例中归纳出学习结果.二十世纪八十年代以来，被研究最多、应用最广的是“从样例中学习”（也就是广义的归纳学习），它涵盖了监督学习、无监督学习等，本书大部分内容均属此范畴.下面我们对这方面主流技术的演进做一个简单回顾.","pages":[11],"sentences":[{"id":"1.82.1","text":"R. S. Michalski 等人 [Michalski et al., 1983] 把机器学习研究划分为“从样例中学习”“在问题求解和规划中学习”“通过观察和发现学习”“从指令中学习”等种类；E. A. Feigenbaum 等人在著名的《人工智能手册》（第三卷）[Cohen and Feigenbaum, 1983] 中，则把机器学习划分为“机械学习”“示教学习”“类比学习”和“归纳学习”.","html":"R. S. Michalski 等人 [Michalski et al., 1983] 把机器学习研究划分为“从样例中学习”“在问题求解和规划中学习”“通过观察和发现学习”“从指令中学习”等种类；E. A. Feigenbaum 等人在著名的《人工智能手册》（第三卷）[Cohen and Feigenbaum, 1983] 中，则把机器学习划分为“机械学习”“示教学习”“类比学习”和“归纳学习”．"},{"id":"1.82.2","text":"机械学习亦称“死记硬背式学习”，即把外界输入的信息全部记录下来，在需要时原封不动地取出来使用，这实际上没有进行真正的学习，仅是在进行信息存储与检索；示教学习和类比学习类似于 R. S. Michalski 等人所说的“从指令中学习”和“通过观察和发现学习”；归纳学习相当于“从样例中学习”，即从训练样例中归纳出学习结果.","html":"机械学习亦称“死记硬背式学习”，即把外界输入的信息全部记录下来，在需要时原封不动地取出来使用，这实际上没有进行真正的学习，仅是在进行信息存储与检索；示教学习和类比学习类似于 R. S. Michalski 等人所说的“从指令中学习”和“通过观察和发现学习”；归纳学习相当于“从样例中学习”，即从训练样例中归纳出学习结果．"},{"id":"1.82.3","text":"二十世纪八十年代以来，被研究最多、应用最广的是“从样例中学习”（也就是广义的归纳学习），它涵盖了监督学习、无监督学习等，本书大部分内容均属此范畴.","html":"二十世纪八十年代以来，被研究最多、应用最广的是“从样例中学习”（也就是广义的归纳学习），它涵盖了监督学习、无监督学习等，本书大部分内容均属此范畴．"},{"id":"1.82.4","text":"下面我们对这方面主流技术的演进做一个简单回顾.","html":"下面我们对这方面主流技术的演进做一个简单回顾．"}],"html":""},"1.83":{"kind":"para","text":"在二十世纪八十年代，“从样例中学习”的一大主流是符号主义学习，其代表包括决策树（decision tree）和基于逻辑的学习.典型的决策树学习以信息论为基础，以信息熵的最小化为目标，直接模拟了人类对概念进行判定的树形流程.基于逻辑的学习的著名代表是归纳逻辑程序设计（Inductive Logic Programming，简称 ILP），可看作机器学习与逻辑程序设计的交叉，它使用一阶逻辑（即谓词逻辑）来进行知识表示，通过修改和扩充逻辑表达式（例如 Prolog 表达式）来完成对数据的归纳.符号主义学习占据主流地位与整个人工智能领域的发展历程是分不开的.前面说过，人工智能在二十世纪五十到八十年代经历了“推理期”和“知识期”，在“推理期”人们基于符号知识表示、通过演绎推理技术取得了很大成就，而在“知识期”人们基于符号知识表示、通过获取和利用领域知识来建立专家系统取得了大量成果，因此，在“学习期”的开始，符号知识表示很自然地受到青睐.事实上，机器学习在二十世纪八十年代正是被视为“解决知识工程瓶颈问题的关键”而走上人工智能主舞台的.决策树学习技术由于简单易用，到今天仍是最常用的机器学习技术之一.ILP 具有很强的知识表示能力，可以较容易地表达出复杂数据关系，而且领域知识通常可方便地通过逻辑表达式进行描述，因此，ILP 不仅可利用领域知识辅助学习，还可通过学习对领域知识进行精化和增强；然而，成也萧何、败也萧何，由于表示能力太强，直接导致学习过程面临的假设空间太大、复杂度极高，因此，问题规模稍大就难以有效进行学习，九十年代中期后这方面的研究相对陷入低潮.","pages":[11,12],"sentences":[{"id":"1.83.1","text":"在二十世纪八十年代，“从样例中学习”的一大主流是符号主义学习，其代表包括决策树（decision tree）和基于逻辑的学习.","html":"在二十世纪八十年代，“从样例中学习”的一大主流是符号主义学习，其代表包括决策树（decision tree）和基于逻辑的学习．"},{"id":"1.83.2","text":"典型的决策树学习以信息论为基础，以信息熵的最小化为目标，直接模拟了人类对概念进行判定的树形流程.","html":"典型的决策树学习以信息论为基础，以信息熵的最小化为目标，直接模拟了人类对概念进行判定的树形流程．"},{"id":"1.83.3","text":"基于逻辑的学习的著名代表是归纳逻辑程序设计（Inductive Logic Programming，简称 ILP），可看作机器学习与逻辑程序设计的交叉，它使用一阶逻辑（即谓词逻辑）来进行知识表示，通过修改和扩充逻辑表达式（例如 Prolog 表达式）来完成对数据的归纳.","html":"基于逻辑的学习的著名代表是归纳逻辑程序设计（Inductive Logic Programming，简称 ILP），可看作机器学习与逻辑程序设计的交叉，它使用一阶逻辑（即谓词逻辑）来进行知识表示，通过修改和扩充逻辑表达式（例如 Prolog 表达式）来完成对数据的归纳．"},{"id":"1.83.4","text":"符号主义学习占据主流地位与整个人工智能领域的发展历程是分不开的.","html":"符号主义学习占据主流地位与整个人工智能领域的发展历程是分不开的．"},{"id":"1.83.5","text":"前面说过，人工智能在二十世纪五十到八十年代经历了“推理期”和“知识期”，在“推理期”人们基于符号知识表示、通过演绎推理技术取得了很大成就，而在“知识期”人们基于符号知识表示、通过获取和利用领域知识来建立专家系统取得了大量成果，因此，在“学习期”的开始，符号知识表示很自然地受到青睐.","html":"前面说过，人工智能在二十世纪五十到八十年代经历了“推理期”和“知识期”，在“推理期”人们基于符号知识表示、通过演绎推理技术取得了很大成就，而在“知识期”人们基于符号知识表示、通过获取和利用领域知识来建立专家系统取得了大量成果，因此，在“学习期”的开始，符号知识表示很自然地受到青睐．"},{"id":"1.83.6","text":"事实上，机器学习在二十世纪八十年代正是被视为“解决知识工程瓶颈问题的关键”而走上人工智能主舞台的.","html":"事实上，机器学习在二十世纪八十年代正是被视为“解决知识工程瓶颈问题的关键”而走上人工智能主舞台的．"},{"id":"1.83.7","text":"决策树学习技术由于简单易用，到今天仍是最常用的机器学习技术之一.","html":"决策树学习技术由于简单易用，到今天仍是最常用的机器学习技术之一．"},{"id":"1.83.8","text":"ILP 具有很强的知识表示能力，可以较容易地表达出复杂数据关系，而且领域知识通常可方便地通过逻辑表达式进行描述，因此，ILP 不仅可利用领域知识辅助学习，还可通过学习对领域知识进行精化和增强；然而，成也萧何、败也萧何，由于表示能力太强，直接导致学习过程面临的假设空间太大、复杂度极高，因此，问题规模稍大就难以有效进行学习，九十年代中期后这方面的研究相对陷入低潮.","html":"ILP 具有很强的知识表示能力，可以较容易地表达出复杂数据关系，而且领域知识通常可方便地通过逻辑表达式进行描述，因此，ILP 不仅可利用领域知识辅助学习，还可通过学习对领域知识进行精化和增强；然而，成也萧何、败也萧何，由于表示能力太强，直接导致学习过程面临的假设空间太大、复杂度极高，因此，问题规模稍大就难以有效进行学习，九十年代中期后这方面的研究相对陷入低潮．"}],"html":""},"1.84":{"kind":"note","text":"参见第 4 章.","pages":[11],"sentences":[{"id":"1.84.1","text":"参见第 4 章.","html":"参见第 4 章．"}],"html":""},"1.85":{"kind":"note","text":"这时实际是 ILP 的前身.","pages":[11],"sentences":[{"id":"1.85.1","text":"这时实际是 ILP 的前身.","html":"这时实际是 ILP 的前身．"}],"html":""},"1.86":{"kind":"note","text":"参见第 15 章.","pages":[11],"sentences":[{"id":"1.86.1","text":"参见第 15 章.","html":"参见第 15 章．"}],"html":""},"1.87":{"kind":"para","text":"二十世纪九十年代中期之前，“从样例中学习”的另一主流技术是基于神经网络的连接主义学习.连接主义学习在二十世纪五十年代取得了大发展，但因为早期的很多人工智能研究者对符号表示有特别偏爱，例如图灵奖得主 H. Simon 曾断言人工智能是研究“对智能行为的符号化建模”，所以当时连接主义的研究未被纳入主流人工智能研究范畴.尤其是连接主义自身也遇到了很大的障碍，正如图灵奖得主 M. Minsky 和 S. Papert 在1969 年指出，（当时的）神经网络只能处理线性分类，甚至对“异或”这么简单的问题都处理不了.1983 年，J. J. Hopfield 利用神经网络求解“流动推销员问题”这个著名的 NP 难题取得重大进展，使得连接主义重新受到人们关注.1986 年，D. E. Rumelhart 等人重新发明了著名的 BP 算法，产生了深远影响.与符号主义学习能产生明确的概念表示不同，连接主义学习产生的是“黑箱”模型，因此从知识获取的角度来看，连接主义学习技术有明显弱点；然而，由于有 BP 这样有效的算法，使得它可以在很多现实问题上发挥作用.事实上，BP 一直是被应用得最广泛的机器学习算法之一.连接主义学习的最大局限是其“试错性”；简单地说，其学习过程涉及大量参数，而参数的设置缺乏理论指导，主要靠手工“调参”；夸张一点说，参数调节上失之毫厘，学习结果可能谬以千里.","pages":[12],"sentences":[{"id":"1.87.1","text":"二十世纪九十年代中期之前，“从样例中学习”的另一主流技术是基于神经网络的连接主义学习.","html":"二十世纪九十年代中期之前，“从样例中学习”的另一主流技术是基于神经网络的连接主义学习．"},{"id":"1.87.2","text":"连接主义学习在二十世纪五十年代取得了大发展，但因为早期的很多人工智能研究者对符号表示有特别偏爱，例如图灵奖得主 H. Simon 曾断言人工智能是研究“对智能行为的符号化建模”，所以当时连接主义的研究未被纳入主流人工智能研究范畴.","html":"连接主义学习在二十世纪五十年代取得了大发展，但因为早期的很多人工智能研究者对符号表示有特别偏爱，例如图灵奖得主 H. Simon 曾断言人工智能是研究“对智能行为的符号化建模”，所以当时连接主义的研究未被纳入主流人工智能研究范畴．"},{"id":"1.87.3","text":"尤其是连接主义自身也遇到了很大的障碍，正如图灵奖得主 M. Minsky 和 S. Papert 在1969 年指出，（当时的）神经网络只能处理线性分类，甚至对“异或”这么简单的问题都处理不了.","html":"尤其是连接主义自身也遇到了很大的障碍，正如图灵奖得主 M. Minsky 和 S. Papert 在1969 年指出，（当时的）神经网络只能处理线性分类，甚至对“异或”这么简单的问题都处理不了．"},{"id":"1.87.4","text":"1983 年，J. J. Hopfield 利用神经网络求解“流动推销员问题”这个著名的 NP 难题取得重大进展，使得连接主义重新受到人们关注.","html":"1983 年，J. J. Hopfield 利用神经网络求解“流动推销员问题”这个著名的 NP 难题取得重大进展，使得连接主义重新受到人们关注．"},{"id":"1.87.5","text":"1986 年，D. E. Rumelhart 等人重新发明了著名的 BP 算法，产生了深远影响.","html":"1986 年，D. E. Rumelhart 等人重新发明了著名的 BP 算法，产生了深远影响．"},{"id":"1.87.6","text":"与符号主义学习能产生明确的概念表示不同，连接主义学习产生的是“黑箱”模型，因此从知识获取的角度来看，连接主义学习技术有明显弱点；然而，由于有 BP 这样有效的算法，使得它可以在很多现实问题上发挥作用.","html":"与符号主义学习能产生明确的概念表示不同，连接主义学习产生的是“黑箱”模型，因此从知识获取的角度来看，连接主义学习技术有明显弱点；然而，由于有 BP 这样有效的算法，使得它可以在很多现实问题上发挥作用．"},{"id":"1.87.7","text":"事实上，BP 一直是被应用得最广泛的机器学习算法之一.","html":"事实上，BP 一直是被应用得最广泛的机器学习算法之一．"},{"id":"1.87.8","text":"连接主义学习的最大局限是其“试错性”；简单地说，其学习过程涉及大量参数，而参数的设置缺乏理论指导，主要靠手工“调参”；夸张一点说，参数调节上失之毫厘，学习结果可能谬以千里.","html":"连接主义学习的最大局限是其“试错性”；简单地说，其学习过程涉及大量参数，而参数的设置缺乏理论指导，主要靠手工“调参”；夸张一点说，参数调节上失之毫厘，学习结果可能谬以千里．"}],"html":""},"1.88":{"kind":"note","text":"参见第 5 章.","pages":[12],"sentences":[{"id":"1.88.1","text":"参见第 5 章.","html":"参见第 5 章．"}],"html":""},"1.89":{"kind":"para","text":"二十世纪九十年代中期，“统计学习”（statistical learning）闪亮登场并迅速占据主流舞台，代表性技术是支持向量机（Support Vector Machine，简称 SVM）以及更一般的“核方法”（kernel methods）.这方面的研究早在二十世纪六七十年代就已开始，统计学习理论 [Vapnik, 1998] 在那个时期也已打下了基础，例如 V. N. Vapnik 在 1963 年提出了“支持向量”概念，他和 A. J. Chervonenkis 在 1968 年提出 VC 维，在 1974 年提出了结构风险最小化原则等.但直到九十年代中期统计学习才开始成为机器学习的主流，一方面是由于有效的支持向量机算法在九十年代初才被提出，其优越性能到九十年代中期在文本分类应用中才得以显现；另一方面，正是在连接主义学习技术的局限性凸显之后，人们才把目光转向了以统计学习理论为直接支撑的统计学习技术.事实上，统计学习与连接主义学习有密切的联系.在支持向量机被普遍接受后，核技巧（kernel trick）被人们用到了机器学习的几乎每一个角落，核方法也逐渐成为机器学习的基本内容之一.","pages":[12],"sentences":[{"id":"1.89.1","text":"二十世纪九十年代中期，“统计学习”（statistical learning）闪亮登场并迅速占据主流舞台，代表性技术是支持向量机（Support Vector Machine，简称 SVM）以及更一般的“核方法”（kernel methods）.","html":"二十世纪九十年代中期，“统计学习”（statistical learning）闪亮登场并迅速占据主流舞台，代表性技术是支持向量机（Support Vector Machine，简称 SVM）以及更一般的“核方法”（kernel methods）．"},{"id":"1.89.2","text":"这方面的研究早在二十世纪六七十年代就已开始，统计学习理论 [Vapnik, 1998] 在那个时期也已打下了基础，例如 V. N. Vapnik 在 1963 年提出了“支持向量”概念，他和 A. J. Chervonenkis 在 1968 年提出 VC 维，在 1974 年提出了结构风险最小化原则等.","html":"这方面的研究早在二十世纪六七十年代就已开始，统计学习理论 [Vapnik, 1998] 在那个时期也已打下了基础，例如 V. N. Vapnik 在 1963 年提出了“支持向量”概念，他和 A. J. Chervonenkis 在 1968 年提出 VC 维，在 1974 年提出了结构风险最小化原则等．"},{"id":"1.89.3","text":"但直到九十年代中期统计学习才开始成为机器学习的主流，一方面是由于有效的支持向量机算法在九十年代初才被提出，其优越性能到九十年代中期在文本分类应用中才得以显现；另一方面，正是在连接主义学习技术的局限性凸显之后，人们才把目光转向了以统计学习理论为直接支撑的统计学习技术.","html":"但直到九十年代中期统计学习才开始成为机器学习的主流，一方面是由于有效的支持向量机算法在九十年代初才被提出，其优越性能到九十年代中期在文本分类应用中才得以显现；另一方面，正是在连接主义学习技术的局限性凸显之后，人们才把目光转向了以统计学习理论为直接支撑的统计学习技术．"},{"id":"1.89.4","text":"事实上，统计学习与连接主义学习有密切的联系.","html":"事实上，统计学习与连接主义学习有密切的联系．"},{"id":"1.89.5","text":"在支持向量机被普遍接受后，核技巧（kernel trick）被人们用到了机器学习的几乎每一个角落，核方法也逐渐成为机器学习的基本内容之一.","html":"在支持向量机被普遍接受后，核技巧（kernel trick）被人们用到了机器学习的几乎每一个角落，核方法也逐渐成为机器学习的基本内容之一．"}],"html":""},"1.90":{"kind":"note","text":"参见第 6 章.","pages":[12],"sentences":[{"id":"1.90.1","text":"参见第 6 章.","html":"参见第 6 章．"}],"html":""},"1.91":{"kind":"note","text":"参见习题 6.5.","pages":[12],"sentences":[{"id":"1.91.1","text":"参见习题 6.5.","html":"参见习题 6.5."}],"html":""},"1.92":{"kind":"para","text":"有趣的是，二十一世纪初，连接主义学习又卷土重来，掀起了以“深度学习”为名的热潮.所谓深度学习，狭义地说就是“很多层”的神经网络.在若干测试和竞赛上，尤其是涉及语音、图像等复杂对象的应用中，深度学习技术取得了优越性能.以往机器学习技术在应用中要取得好性能，对使用者的要求较高；而深度学习技术涉及的模型复杂度非常高，以至于只要下工夫“调参”，把参数调节好，性能往往就好.因此，深度学习虽缺乏严格的理论基础，但它显著降低了机器学习应用者的门槛，为机器学习技术走向工程实践带来了便利.那么，它为什么此时才热起来呢？有两个基本原因：数据大了、计算能力强了.深度学习模型拥有大量参数，若数据样本少，则很容易“过拟合”；如此复杂的模型、如此大的数据样本，若缺乏强力计算设备，根本无法求解.恰由于人类进入了“大数据时代”，数据储量与计算设备都有了大发展，才使得连接主义学习技术焕发又一春.有趣的是，神经网络在二十世纪八十年代中期走红，与当时 Intel x86 系列微处理器与内存条技术的广泛应用所造成的计算能力、数据访存效率比七十年代有显著提高不无关联.深度学习此时的状况，与彼时的神经网络何其相似.","pages":[12,13],"sentences":[{"id":"1.92.1","text":"有趣的是，二十一世纪初，连接主义学习又卷土重来，掀起了以“深度学习”为名的热潮.","html":"有趣的是，二十一世纪初，连接主义学习又卷土重来，掀起了以“深度学习”为名的热潮．"},{"id":"1.92.2","text":"所谓深度学习，狭义地说就是“很多层”的神经网络.","html":"所谓深度学习，狭义地说就是“很多层”的神经网络．"},{"id":"1.92.3","text":"在若干测试和竞赛上，尤其是涉及语音、图像等复杂对象的应用中，深度学习技术取得了优越性能.","html":"在若干测试和竞赛上，尤其是涉及语音、图像等复杂对象的应用中，深度学习技术取得了优越性能．"},{"id":"1.92.4","text":"以往机器学习技术在应用中要取得好性能，对使用者的要求较高；而深度学习技术涉及的模型复杂度非常高，以至于只要下工夫“调参”，把参数调节好，性能往往就好.","html":"以往机器学习技术在应用中要取得好性能，对使用者的要求较高；而深度学习技术涉及的模型复杂度非常高，以至于只要下工夫“调参”，把参数调节好，性能往往就好．"},{"id":"1.92.5","text":"因此，深度学习虽缺乏严格的理论基础，但它显著降低了机器学习应用者的门槛，为机器学习技术走向工程实践带来了便利.","html":"因此，深度学习虽缺乏严格的理论基础，但它显著降低了机器学习应用者的门槛，为机器学习技术走向工程实践带来了便利．"},{"id":"1.92.6","text":"那么，它为什么此时才热起来呢？","html":"那么，它为什么此时才热起来呢？"},{"id":"1.92.7","text":"有两个基本原因：数据大了、计算能力强了.","html":"有两个基本原因：数据大了、计算能力强了．"},{"id":"1.92.8","text":"深度学习模型拥有大量参数，若数据样本少，则很容易“过拟合”；如此复杂的模型、如此大的数据样本，若缺乏强力计算设备，根本无法求解.","html":"深度学习模型拥有大量参数，若数据样本少，则很容易“过拟合”；如此复杂的模型、如此大的数据样本，若缺乏强力计算设备，根本无法求解．"},{"id":"1.92.9","text":"恰由于人类进入了“大数据时代”，数据储量与计算设备都有了大发展，才使得连接主义学习技术焕发又一春.","html":"恰由于人类进入了“大数据时代”，数据储量与计算设备都有了大发展，才使得连接主义学习技术焕发又一春．"},{"id":"1.92.10","text":"有趣的是，神经网络在二十世纪八十年代中期走红，与当时 Intel x86 系列微处理器与内存条技术的广泛应用所造成的计算能力、数据访存效率比七十年代有显著提高不无关联.","html":"有趣的是，神经网络在二十世纪八十年代中期走红，与当时 Intel x86 系列微处理器与内存条技术的广泛应用所造成的计算能力、数据访存效率比七十年代有显著提高不无关联．"},{"id":"1.92.11","text":"深度学习此时的状况，与彼时的神经网络何其相似.","html":"深度学习此时的状况，与彼时的神经网络何其相似．"}],"html":""},"1.93":{"kind":"note","text":"参见 5.6 节.","pages":[13],"sentences":[{"id":"1.93.1","text":"参见 5.6 节.","html":"参见 5.6 节．"}],"html":""},"1.94":{"kind":"note","text":"“过拟合”参见第 2 章.","pages":[13],"sentences":[{"id":"1.94.1","text":"“过拟合”参见第 2 章.","html":"“过拟合”参见第 2 章．"}],"html":""},"1.95":{"kind":"para","text":"需说明的是，机器学习现在已经发展成为一个相当大的学科领域，本节仅是管中窥豹，很多重要技术都没有谈及，耐心的读者在读完本书后会有更全面的了解.","pages":[13],"sentences":[{"id":"1.95.1","text":"需说明的是，机器学习现在已经发展成为一个相当大的学科领域，本节仅是管中窥豹，很多重要技术都没有谈及，耐心的读者在读完本书后会有更全面的了解.","html":"需说明的是，机器学习现在已经发展成为一个相当大的学科领域，本节仅是管中窥豹，很多重要技术都没有谈及，耐心的读者在读完本书后会有更全面的了解．"}],"html":""},"1.96":{"kind":"heading","level":2,"text":"1.6 应用现状","pages":[13],"html":"1.6 应用现状"},"1.97":{"kind":"para","text":"在过去二十年中，人类收集、存储、传输、处理数据的能力取得了飞速提升，人类社会的各个角落都积累了大量数据，亟需能有效地对数据进行分析利用的计算机算法，而机器学习恰顺应了大时代的这个迫切需求，因此该学科领域很自然地取得巨大发展、受到广泛关注.","pages":[13],"sentences":[{"id":"1.97.1","text":"在过去二十年中，人类收集、存储、传输、处理数据的能力取得了飞速提升，人类社会的各个角落都积累了大量数据，亟需能有效地对数据进行分析利用的计算机算法，而机器学习恰顺应了大时代的这个迫切需求，因此该学科领域很自然地取得巨大发展、受到广泛关注.","html":"在过去二十年中，人类收集、存储、传输、处理数据的能力取得了飞速提升，人类社会的各个角落都积累了大量数据，亟需能有效地对数据进行分析利用的计算机算法，而机器学习恰顺应了大时代的这个迫切需求，因此该学科领域很自然地取得巨大发展、受到广泛关注．"}],"html":""},"1.98":{"kind":"para","text":"今天，在计算机科学的诸多分支学科领域中，无论是多媒体、图形学，还是网络通信、软件工程，乃至体系结构、芯片设计，都能找到机器学习技术的身影，尤其是在计算机视觉、自然语言处理等“计算机应用技术”领域，机器学习已成为最重要的技术进步源泉之一.","pages":[13],"sentences":[{"id":"1.98.1","text":"今天，在计算机科学的诸多分支学科领域中，无论是多媒体、图形学，还是网络通信、软件工程，乃至体系结构、芯片设计，都能找到机器学习技术的身影，尤其是在计算机视觉、自然语言处理等“计算机应用技术”领域，机器学习已成为最重要的技术进步源泉之一.","html":"今天，在计算机科学的诸多分支学科领域中，无论是多媒体、图形学，还是网络通信、软件工程，乃至体系结构、芯片设计，都能找到机器学习技术的身影，尤其是在计算机视觉、自然语言处理等“计算机应用技术”领域，机器学习已成为最重要的技术进步源泉之一．"}],"html":""},"1.99":{"kind":"para","text":"机器学习还为许多交叉学科提供了重要的技术支撑.例如，“生物信息学”试图利用信息技术来研究生命现象和规律，而基因组计划的实施和基因药物的美好愿景让人们为之心潮澎湃.生物信息学研究涉及从“生命现象”到“规律发现”的整个过程，其间必然包括数据获取、数据管理、数据分析、仿真实验等环节，而“数据分析”恰是机器学习技术的舞台，各种机器学习技术已经在这个舞台上大放异彩.","pages":[13],"sentences":[{"id":"1.99.1","text":"机器学习还为许多交叉学科提供了重要的技术支撑.","html":"机器学习还为许多交叉学科提供了重要的技术支撑．"},{"id":"1.99.2","text":"例如，“生物信息学”试图利用信息技术来研究生命现象和规律，而基因组计划的实施和基因药物的美好愿景让人们为之心潮澎湃.","html":"例如，“生物信息学”试图利用信息技术来研究生命现象和规律，而基因组计划的实施和基因药物的美好愿景让人们为之心潮澎湃．"},{"id":"1.99.3","text":"生物信息学研究涉及从“生命现象”到“规律发现”的整个过程，其间必然包括数据获取、数据管理、数据分析、仿真实验等环节，而“数据分析”恰是机器学习技术的舞台，各种机器学习技术已经在这个舞台上大放异彩.","html":"生物信息学研究涉及从“生命现象”到“规律发现”的整个过程，其间必然包括数据获取、数据管理、数据分析、仿真实验等环节，而“数据分析”恰是机器学习技术的舞台，各种机器学习技术已经在这个舞台上大放异彩．"}],"html":""},"1.100":{"kind":"para","text":"事实上，随着科学研究的基本手段从传统的“理论+实验”走向现在的“理论+实验+计算”，乃至出现“数据科学”这样的提法，机器学习的重要性日趋显著，因为“计算”的目的往往是数据分析，而数据科学的核心也恰是通过分析数据来获得价值.若要列出目前计算机科学技术中最活跃、最受瞩目的研究分支，那么机器学习必居其中.2001 年，美国 NASA-JPL 的科学家在 Science 杂志上专门撰文 [Mjolsness and DeCoste, 2001] 指出，机器学习对科学研究的整个过程正起到越来越大的支撑作用，其进展对科技发展意义重大.2003 年，DARPA 启动 PAL 计划，将机器学习的重要性上升到美国国家安全的高度来考虑.众所周知，美国最尖端科技的研究通常是由 NASA 和 DARPA 推进的，而这两大机构不约而同地强调机器学习的重要性，其意义不言而喻.","pages":[14],"sentences":[{"id":"1.100.1","text":"事实上，随着科学研究的基本手段从传统的“理论+实验”走向现在的“理论+实验+计算”，乃至出现“数据科学”这样的提法，机器学习的重要性日趋显著，因为“计算”的目的往往是数据分析，而数据科学的核心也恰是通过分析数据来获得价值.","html":"事实上，随着科学研究的基本手段从传统的“理论+实验”走向现在的“理论+实验+计算”，乃至出现“数据科学”这样的提法，机器学习的重要性日趋显著，因为“计算”的目的往往是数据分析，而数据科学的核心也恰是通过分析数据来获得价值．"},{"id":"1.100.2","text":"若要列出目前计算机科学技术中最活跃、最受瞩目的研究分支，那么机器学习必居其中.","html":"若要列出目前计算机科学技术中最活跃、最受瞩目的研究分支，那么机器学习必居其中．"},{"id":"1.100.3","text":"2001 年，美国 NASA-JPL 的科学家在 Science 杂志上专门撰文 [Mjolsness and DeCoste, 2001] 指出，机器学习对科学研究的整个过程正起到越来越大的支撑作用，其进展对科技发展意义重大.","html":"2001 年，美国 NASA-JPL 的科学家在 Science 杂志上专门撰文 [Mjolsness and DeCoste, 2001] 指出，机器学习对科学研究的整个过程正起到越来越大的支撑作用，其进展对科技发展意义重大．"},{"id":"1.100.4","text":"2003 年，DARPA 启动 PAL 计划，将机器学习的重要性上升到美国国家安全的高度来考虑.","html":"2003 年，DARPA 启动 PAL 计划，将机器学习的重要性上升到美国国家安全的高度来考虑．"},{"id":"1.100.5","text":"众所周知，美国最尖端科技的研究通常是由 NASA 和 DARPA 推进的，而这两大机构不约而同地强调机器学习的重要性，其意义不言而喻.","html":"众所周知，美国最尖端科技的研究通常是由 NASA 和 DARPA 推进的，而这两大机构不约而同地强调机器学习的重要性，其意义不言而喻．"}],"html":""},"1.101":{"kind":"note","text":"NASA-JPL 的全称是美国航空航天局喷气推进实验室，著名的“勇气”号和“机遇”号火星机器人均是在这个实验室研制的.","pages":[14],"sentences":[{"id":"1.101.1","text":"NASA-JPL 的全称是美国航空航天局喷气推进实验室，著名的“勇气”号和“机遇”号火星机器人均是在这个实验室研制的.","html":"NASA-JPL 的全称是美国航空航天局喷气推进实验室，著名的“勇气”号和“机遇”号火星机器人均是在这个实验室研制的．"}],"html":""},"1.102":{"kind":"note","text":"DARPA 的全称是美国国防部先进研究计划局，互联网、全球卫星定位系统等都源于 DARPA 启动的研究项目.","pages":[14],"sentences":[{"id":"1.102.1","text":"DARPA 的全称是美国国防部先进研究计划局，互联网、全球卫星定位系统等都源于 DARPA 启动的研究项目.","html":"DARPA 的全称是美国国防部先进研究计划局，互联网、全球卫星定位系统等都源于 DARPA 启动的研究项目．"}],"html":""},"1.103":{"kind":"para","text":"2006 年，卡耐基梅隆大学宣告成立世界上第一个“机器学习系”，机器学习领域奠基人之一 T. Mitchell 教授出任首任系主任.2012 年 3 月，美国奥巴马政府启动“大数据研究与发展计划”，美国国家科学基金会旋即在加州大学伯克利分校启动加强计划，强调要深入研究和整合大数据时代的三大关键技术：机器学习、云计算、众包（crowdsourcing）.显然，机器学习在大数据时代是必不可少的核心技术，道理很简单：收集、存储、传输、管理大数据的目的，是为了“利用”大数据，而如果没有机器学习技术分析数据，则“利用”无从谈起.","pages":[14],"sentences":[{"id":"1.103.1","text":"2006 年，卡耐基梅隆大学宣告成立世界上第一个“机器学习系”，机器学习领域奠基人之一 T. Mitchell 教授出任首任系主任.","html":"2006 年，卡耐基梅隆大学宣告成立世界上第一个“机器学习系”，机器学习领域奠基人之一 T. Mitchell 教授出任首任系主任．"},{"id":"1.103.2","text":"2012 年 3 月，美国奥巴马政府启动“大数据研究与发展计划”，美国国家科学基金会旋即在加州大学伯克利分校启动加强计划，强调要深入研究和整合大数据时代的三大关键技术：机器学习、云计算、众包（crowdsourcing）.","html":"2012 年 3 月，美国奥巴马政府启动“大数据研究与发展计划”，美国国家科学基金会旋即在加州大学伯克利分校启动加强计划，强调要深入研究和整合大数据时代的三大关键技术：机器学习、云计算、众包（crowdsourcing）．"},{"id":"1.103.3","text":"显然，机器学习在大数据时代是必不可少的核心技术，道理很简单：收集、存储、传输、管理大数据的目的，是为了“利用”大数据，而如果没有机器学习技术分析数据，则“利用”无从谈起.","html":"显然，机器学习在大数据时代是必不可少的核心技术，道理很简单：收集、存储、传输、管理大数据的目的，是为了“利用”大数据，而如果没有机器学习技术分析数据，则“利用”无从谈起．"}],"html":""},"1.104":{"kind":"note","text":"机器学习提供数据分析能力，云计算提供数据处理能力，众包提供数据标记能力.","pages":[14],"sentences":[{"id":"1.104.1","text":"机器学习提供数据分析能力，云计算提供数据处理能力，众包提供数据标记能力.","html":"机器学习提供数据分析能力，云计算提供数据处理能力，众包提供数据标记能力．"}],"html":""},"1.105":{"kind":"para","text":"谈到对数据进行分析利用，很多人会想到“数据挖掘”（data mining），这里简单探讨一下数据挖掘与机器学习的联系.数据挖掘领域在二十世纪九十年代形成，它受到很多学科领域的影响，其中数据库、机器学习、统计学无疑影响最大 [Zhou, 2003].数据挖掘是从海量数据中发掘知识，这就必然涉及对“海量数据”的管理和分析.大体来说，数据库领域的研究为数据挖掘提供数据管理技术，而机器学习和统计学的研究为数据挖掘提供数据分析技术.由于统计学界的研究成果通常需要经由机器学习研究来形成有效的学习算法，之后再进入数据挖掘领域，因此从这个意义上说，统计学主要是通过机器学习对数据挖掘发挥影响，而机器学习领域和数据库领域则是数据挖掘的两大支撑.","pages":[14],"sentences":[{"id":"1.105.1","text":"谈到对数据进行分析利用，很多人会想到“数据挖掘”（data mining），这里简单探讨一下数据挖掘与机器学习的联系.","html":"谈到对数据进行分析利用，很多人会想到“数据挖掘”（data mining），这里简单探讨一下数据挖掘与机器学习的联系．"},{"id":"1.105.2","text":"数据挖掘领域在二十世纪九十年代形成，它受到很多学科领域的影响，其中数据库、机器学习、统计学无疑影响最大 [Zhou, 2003].数据挖掘是从海量数据中发掘知识，这就必然涉及对“海量数据”的管理和分析.","html":"数据挖掘领域在二十世纪九十年代形成，它受到很多学科领域的影响，其中数据库、机器学习、统计学无疑影响最大 [Zhou, 2003].数据挖掘是从海量数据中发掘知识，这就必然涉及对“海量数据”的管理和分析．"},{"id":"1.105.3","text":"大体来说，数据库领域的研究为数据挖掘提供数据管理技术，而机器学习和统计学的研究为数据挖掘提供数据分析技术.","html":"大体来说，数据库领域的研究为数据挖掘提供数据管理技术，而机器学习和统计学的研究为数据挖掘提供数据分析技术．"},{"id":"1.105.4","text":"由于统计学界的研究成果通常需要经由机器学习研究来形成有效的学习算法，之后再进入数据挖掘领域，因此从这个意义上说，统计学主要是通过机器学习对数据挖掘发挥影响，而机器学习领域和数据库领域则是数据挖掘的两大支撑.","html":"由于统计学界的研究成果通常需要经由机器学习研究来形成有效的学习算法，之后再进入数据挖掘领域，因此从这个意义上说，统计学主要是通过机器学习对数据挖掘发挥影响，而机器学习领域和数据库领域则是数据挖掘的两大支撑．"}],"html":""},"1.106":{"kind":"note","text":"“数据挖掘”这个词很早就在统计学界出现并略带贬义，这是由于传统统计学研究往往醉心于理论的优美而忽视实际效用.但最近情况发生变化，越来越多的统计学家开始关注现实问题，进入机器学习和数据挖掘领域.","pages":[14],"sentences":[{"id":"1.106.1","text":"“数据挖掘”这个词很早就在统计学界出现并略带贬义，这是由于传统统计学研究往往醉心于理论的优美而忽视实际效用.","html":"“数据挖掘”这个词很早就在统计学界出现并略带贬义，这是由于传统统计学研究往往醉心于理论的优美而忽视实际效用．"},{"id":"1.106.2","text":"但最近情况发生变化，越来越多的统计学家开始关注现实问题，进入机器学习和数据挖掘领域.","html":"但最近情况发生变化，越来越多的统计学家开始关注现实问题，进入机器学习和数据挖掘领域．"}],"html":""},"1.107":{"kind":"para","text":"今天，机器学习已经与普通人的生活密切相关.例如在天气预报、能源勘探、环境监测等方面，有效地利用机器学习技术对卫星和传感器发回的数据进行分析，是提高预报和检测准确性的重要途径；在商业营销中，有效地利用机器学习技术对销售数据、客户信息进行分析，不仅可帮助商家优化库存降低成本，还有助于针对用户群设计特殊营销策略；……下面再举几例：","pages":[14],"sentences":[{"id":"1.107.1","text":"今天，机器学习已经与普通人的生活密切相关.","html":"今天，机器学习已经与普通人的生活密切相关．"},{"id":"1.107.2","text":"例如在天气预报、能源勘探、环境监测等方面，有效地利用机器学习技术对卫星和传感器发回的数据进行分析，是提高预报和检测准确性的重要途径；在商业营销中，有效地利用机器学习技术对销售数据、客户信息进行分析，不仅可帮助商家优化库存降低成本，还有助于针对用户群设计特殊营销策略；……下面再举几例：","html":"例如在天气预报、能源勘探、环境监测等方面，有效地利用机器学习技术对卫星和传感器发回的数据进行分析，是提高预报和检测准确性的重要途径；在商业营销中，有效地利用机器学习技术对销售数据、客户信息进行分析，不仅可帮助商家优化库存降低成本，还有助于针对用户群设计特殊营销策略；……下面再举几例："}],"html":""},"1.108":{"kind":"para","text":"众所周知，谷歌、百度等互联网搜索引擎已开始改变人类的生活方式，例如很多人已习惯于在出行前通过互联网搜索来了解目的地信息、寻找合适的酒店、餐馆等.美国《新闻周刊》曾对谷歌有一句话评论：“它使任何人离任何问题的答案间的距离变得只有点击一下鼠标这么远.”显然，互联网搜索是通过分析网络上的数据来找到用户所需的信息，在这个过程中，用户查询是输入、搜索结果是输出，而要建立输入与输出之间的联系，内核必然需要机器学习技术.事实上，互联网搜索发展至今，机器学习技术的支撑厥功至伟.到了今天，搜索的对象、内容日趋复杂，机器学习技术的影响更为明显，例如在进行“图片搜索”时，无论谷歌还是百度都在使用最新潮的机器学习技术.谷歌、百度、脸书、雅虎等公司纷纷成立专攻机器学习技术的研究团队，甚至直接以机器学习技术命名的研究院，充分体现出机器学习技术的发展和应用，甚至在一定程度上影响了互联网产业的走向.","pages":[14,15],"errata":[{"was":"居功","now":"厥功"}],"sentences":[{"id":"1.108.1","text":"众所周知，谷歌、百度等互联网搜索引擎已开始改变人类的生活方式，例如很多人已习惯于在出行前通过互联网搜索来了解目的地信息、寻找合适的酒店、餐馆等.","html":"众所周知，谷歌、百度等互联网搜索引擎已开始改变人类的生活方式，例如很多人已习惯于在出行前通过互联网搜索来了解目的地信息、寻找合适的酒店、餐馆等．"},{"id":"1.108.2","text":"美国《新闻周刊》曾对谷歌有一句话评论：“它使任何人离任何问题的答案间的距离变得只有点击一下鼠标这么远.”","html":"美国《新闻周刊》曾对谷歌有一句话评论：“它使任何人离任何问题的答案间的距离变得只有点击一下鼠标这么远．”"},{"id":"1.108.3","text":"显然，互联网搜索是通过分析网络上的数据来找到用户所需的信息，在这个过程中，用户查询是输入、搜索结果是输出，而要建立输入与输出之间的联系，内核必然需要机器学习技术.","html":"显然，互联网搜索是通过分析网络上的数据来找到用户所需的信息，在这个过程中，用户查询是输入、搜索结果是输出，而要建立输入与输出之间的联系，内核必然需要机器学习技术．"},{"id":"1.108.4","text":"事实上，互联网搜索发展至今，机器学习技术的支撑厥功至伟.","html":"事实上，互联网搜索发展至今，机器学习技术的支撑厥功至伟．\u003cspan class=\"erratum\">［按作者勘误，原印为“居功”］\u003c/span>"},{"id":"1.108.5","text":"到了今天，搜索的对象、内容日趋复杂，机器学习技术的影响更为明显，例如在进行“图片搜索”时，无论谷歌还是百度都在使用最新潮的机器学习技术.","html":"到了今天，搜索的对象、内容日趋复杂，机器学习技术的影响更为明显，例如在进行“图片搜索”时，无论谷歌还是百度都在使用最新潮的机器学习技术．"},{"id":"1.108.6","text":"谷歌、百度、脸书、雅虎等公司纷纷成立专攻机器学习技术的研究团队，甚至直接以机器学习技术命名的研究院，充分体现出机器学习技术的发展和应用，甚至在一定程度上影响了互联网产业的走向.","html":"谷歌、百度、脸书、雅虎等公司纷纷成立专攻机器学习技术的研究团队，甚至直接以机器学习技术命名的研究院，充分体现出机器学习技术的发展和应用，甚至在一定程度上影响了互联网产业的走向．"}],"html":""},"1.109":{"kind":"para","text":"再举一例.车祸是人类最凶险的杀手之一，全世界每年有上百万人丧生车轮，仅我国每年就有约十万人死于车祸.由计算机来实现自动汽车驾驶是一个理想的方案，因为机器上路时可以确保不是新手驾驶、不会疲劳驾驶，更不会酒后驾驶，而且还有重要的军事用途.美国在二十世纪八十年代就开始进行这方面研究.这里最大的困难是无法在汽车厂里事先把汽车上路后所会遇到的所有情况都考虑到、设计出处理规则并加以编程实现，而只能根据上路时遇到的情况即时处理.若把车载传感器接收到的信息作为输入，把方向、刹车、油门的控制行为作为输出，则这里的关键问题恰可抽象为一个机器学习任务.2004 年 3 月，在美国 DARPA 组织的自动驾驶车比赛中，斯坦福大学机器学习专家 S. Thrun的小组研制的参赛车用 6 小时 53 分钟成功走完了 132 英里赛程获得冠军.比赛路段是在内华达州西南部的山区和沙漠中，路况相当复杂，在这样的路段上行车即使对经验丰富的人类司机来说也是一个挑战.S. Thrun 后来到谷歌领导自动驾驶车项目团队.值得一提的是，自动驾驶车在近几年取得了飞跃式发展，除谷歌外，通用、奥迪、大众、宝马等传统汽车公司均投入巨资进行研发，目前已开始有产品进入市场.2011 年 6 月，美国内华达州议会通过法案，成为美国第一个认可自动驾驶车的州，此后，夏威夷州和佛罗里达州也先后通过类似法案.自动驾驶汽车可望在不久的将来出现在普通人的生活中，而机器学习技术则起到了“司机”作用.","pages":[15],"sentences":[{"id":"1.109.1","text":"再举一例.","html":"再举一例．"},{"id":"1.109.2","text":"车祸是人类最凶险的杀手之一，全世界每年有上百万人丧生车轮，仅我国每年就有约十万人死于车祸.","html":"车祸是人类最凶险的杀手之一，全世界每年有上百万人丧生车轮，仅我国每年就有约十万人死于车祸．"},{"id":"1.109.3","text":"由计算机来实现自动汽车驾驶是一个理想的方案，因为机器上路时可以确保不是新手驾驶、不会疲劳驾驶，更不会酒后驾驶，而且还有重要的军事用途.","html":"由计算机来实现自动汽车驾驶是一个理想的方案，因为机器上路时可以确保不是新手驾驶、不会疲劳驾驶，更不会酒后驾驶，而且还有重要的军事用途．"},{"id":"1.109.4","text":"美国在二十世纪八十年代就开始进行这方面研究.","html":"美国在二十世纪八十年代就开始进行这方面研究．"},{"id":"1.109.5","text":"这里最大的困难是无法在汽车厂里事先把汽车上路后所会遇到的所有情况都考虑到、设计出处理规则并加以编程实现，而只能根据上路时遇到的情况即时处理.","html":"这里最大的困难是无法在汽车厂里事先把汽车上路后所会遇到的所有情况都考虑到、设计出处理规则并加以编程实现，而只能根据上路时遇到的情况即时处理．"},{"id":"1.109.6","text":"若把车载传感器接收到的信息作为输入，把方向、刹车、油门的控制行为作为输出，则这里的关键问题恰可抽象为一个机器学习任务.","html":"若把车载传感器接收到的信息作为输入，把方向、刹车、油门的控制行为作为输出，则这里的关键问题恰可抽象为一个机器学习任务．"},{"id":"1.109.7","text":"2004 年 3 月，在美国 DARPA 组织的自动驾驶车比赛中，斯坦福大学机器学习专家 S. Thrun的小组研制的参赛车用 6 小时 53 分钟成功走完了 132 英里赛程获得冠军.","html":"2004 年 3 月，在美国 DARPA 组织的自动驾驶车比赛中，斯坦福大学机器学习专家 S. Thrun的小组研制的参赛车用 6 小时 53 分钟成功走完了 132 英里赛程获得冠军．"},{"id":"1.109.8","text":"比赛路段是在内华达州西南部的山区和沙漠中，路况相当复杂，在这样的路段上行车即使对经验丰富的人类司机来说也是一个挑战.","html":"比赛路段是在内华达州西南部的山区和沙漠中，路况相当复杂，在这样的路段上行车即使对经验丰富的人类司机来说也是一个挑战．"},{"id":"1.109.9","text":"S. Thrun 后来到谷歌领导自动驾驶车项目团队.","html":"S. Thrun 后来到谷歌领导自动驾驶车项目团队．"},{"id":"1.109.10","text":"值得一提的是，自动驾驶车在近几年取得了飞跃式发展，除谷歌外，通用、奥迪、大众、宝马等传统汽车公司均投入巨资进行研发，目前已开始有产品进入市场.","html":"值得一提的是，自动驾驶车在近几年取得了飞跃式发展，除谷歌外，通用、奥迪、大众、宝马等传统汽车公司均投入巨资进行研发，目前已开始有产品进入市场．"},{"id":"1.109.11","text":"2011 年 6 月，美国内华达州议会通过法案，成为美国第一个认可自动驾驶车的州，此后，夏威夷州和佛罗里达州也先后通过类似法案.","html":"2011 年 6 月，美国内华达州议会通过法案，成为美国第一个认可自动驾驶车的州，此后，夏威夷州和佛罗里达州也先后通过类似法案．"},{"id":"1.109.12","text":"自动驾驶汽车可望在不久的将来出现在普通人的生活中，而机器学习技术则起到了“司机”作用.","html":"自动驾驶汽车可望在不久的将来出现在普通人的生活中，而机器学习技术则起到了“司机”作用．"}],"html":""},"1.110":{"kind":"note","text":"例如著名机器学习教科书 [Mitchell, 1997] 4.2 节介绍了二十世纪九十年代早期利用神经网络学习来控制自动驾驶车的 ALVINN 系统.","pages":[15],"sentences":[{"id":"1.110.1","text":"例如著名机器学习教科书 [Mitchell, 1997] 4.2 节介绍了二十世纪九十年代早期利用神经网络学习来控制自动驾驶车的 ALVINN 系统.","html":"例如著名机器学习教科书 [Mitchell, 1997] 4.2 节介绍了二十世纪九十年代早期利用神经网络学习来控制自动驾驶车的 ALVINN 系统．"}],"html":""},"1.111":{"kind":"para","text":"机器学习技术甚至已影响到人类社会政治生活.2012 年美国大选期间，奥巴马麾下有一支机器学习团队，他们对各类选情数据进行分析，为奥巴马提示下一步竞选行动.例如他们使用机器学习技术分析社交网络数据，判断出在总统候选人第一次辩论之后哪些选民会倒戈，并根据分析的结果开发出个性化宣传策略，能为每位选民找出一个最有说服力的挽留理由；他们基于机器学习模型的分析结果提示奥巴马应去何处开展拉票活动，有些建议甚至让专业竞选顾问大吃一惊，而结果表明去这些地方大有收获.总统选举需要大量金钱，机器学习技术在这方面发挥了奇效.例如，机器学习模型分析出，某电影明星对某地区某年龄段的特定人群很有吸引力，而这个群体很愿意出高价与该明星及奥巴马共进晚餐……果然，这样一次筹资晚宴成功募集到 1500 万美元；最终，借助机器学习模型，奥巴马筹到了创纪录的 10 亿美元竞选经费.机器学习技术不仅有助于竞选经费“开源”，还可帮助“节流”，例如机器学习模型通过对不同群体选民进行分析，建议购买了一些冷门节目的广告时段，而没有采用在昂贵的黄金时段购买广告的传统做法，使得广告资金效率相比 2008 年竞选提高了 14%；……胜选后，《时代》周刊专门报道了这个被奥巴马称为“竞选核武器”、由半监督学习研究专家 R. Ghani 领导的团队.","pages":[15,16],"sentences":[{"id":"1.111.1","text":"机器学习技术甚至已影响到人类社会政治生活.","html":"机器学习技术甚至已影响到人类社会政治生活．"},{"id":"1.111.2","text":"2012 年美国大选期间，奥巴马麾下有一支机器学习团队，他们对各类选情数据进行分析，为奥巴马提示下一步竞选行动.","html":"2012 年美国大选期间，奥巴马麾下有一支机器学习团队，他们对各类选情数据进行分析，为奥巴马提示下一步竞选行动．"},{"id":"1.111.3","text":"例如他们使用机器学习技术分析社交网络数据，判断出在总统候选人第一次辩论之后哪些选民会倒戈，并根据分析的结果开发出个性化宣传策略，能为每位选民找出一个最有说服力的挽留理由；他们基于机器学习模型的分析结果提示奥巴马应去何处开展拉票活动，有些建议甚至让专业竞选顾问大吃一惊，而结果表明去这些地方大有收获.","html":"例如他们使用机器学习技术分析社交网络数据，判断出在总统候选人第一次辩论之后哪些选民会倒戈，并根据分析的结果开发出个性化宣传策略，能为每位选民找出一个最有说服力的挽留理由；他们基于机器学习模型的分析结果提示奥巴马应去何处开展拉票活动，有些建议甚至让专业竞选顾问大吃一惊，而结果表明去这些地方大有收获．"},{"id":"1.111.4","text":"总统选举需要大量金钱，机器学习技术在这方面发挥了奇效.","html":"总统选举需要大量金钱，机器学习技术在这方面发挥了奇效．"},{"id":"1.111.5","text":"例如，机器学习模型分析出，某电影明星对某地区某年龄段的特定人群很有吸引力，而这个群体很愿意出高价与该明星及奥巴马共进晚餐……果然，这样一次筹资晚宴成功募集到 1500 万美元；最终，借助机器学习模型，奥巴马筹到了创纪录的 10 亿美元竞选经费.","html":"例如，机器学习模型分析出，某电影明星对某地区某年龄段的特定人群很有吸引力，而这个群体很愿意出高价与该明星及奥巴马共进晚餐……果然，这样一次筹资晚宴成功募集到 1500 万美元；最终，借助机器学习模型，奥巴马筹到了创纪录的 10 亿美元竞选经费．"},{"id":"1.111.6","text":"机器学习技术不仅有助于竞选经费“开源”，还可帮助“节流”，例如机器学习模型通过对不同群体选民进行分析，建议购买了一些冷门节目的广告时段，而没有采用在昂贵的黄金时段购买广告的传统做法，使得广告资金效率相比 2008 年竞选提高了 14%；……胜选后，《时代》周刊专门报道了这个被奥巴马称为“竞选核武器”、由半监督学习研究专家 R. Ghani 领导的团队.","html":"机器学习技术不仅有助于竞选经费“开源”，还可帮助“节流”，例如机器学习模型通过对不同群体选民进行分析，建议购买了一些冷门节目的广告时段，而没有采用在昂贵的黄金时段购买广告的传统做法，使得广告资金效率相比 2008 年竞选提高了 14%；……胜选后，《时代》周刊专门报道了这个被奥巴马称为“竞选核武器”、由半监督学习研究专家 R. Ghani 领导的团队．"}],"html":""},"1.112":{"kind":"para","text":"值得一提的是，机器学习备受瞩目当然是由于它已成为智能数据分析技术的创新源泉，但机器学习研究还有另一个不可忽视的意义，即通过建立一些关于学习的计算模型来促进我们理解“人类如何学习”.例如，P. Kanerva 在二十世纪八十年代中期提出 SDM（Sparse Distributed Memory）模型 [Kanerva, 1988] 时并没有刻意模仿脑生理结构，但后来神经科学的研究发现，SDM 的稀疏编码机制在视觉、听觉、嗅觉功能的脑皮层中广泛存在，从而为理解脑的某些功能提供了一定的启发.自然科学研究的驱动力归结起来无外是人类对宇宙本源、万物本质、生命本性、自我本识的好奇，而“人类如何学习”无疑是一个有关自我本识的重大问题.从这个意义上说，机器学习不仅在信息科学中占有重要地位，还具有一定的自然科学探索色彩.","pages":[16],"sentences":[{"id":"1.112.1","text":"值得一提的是，机器学习备受瞩目当然是由于它已成为智能数据分析技术的创新源泉，但机器学习研究还有另一个不可忽视的意义，即通过建立一些关于学习的计算模型来促进我们理解“人类如何学习”.","html":"值得一提的是，机器学习备受瞩目当然是由于它已成为智能数据分析技术的创新源泉，但机器学习研究还有另一个不可忽视的意义，即通过建立一些关于学习的计算模型来促进我们理解“人类如何学习”．"},{"id":"1.112.2","text":"例如，P. Kanerva 在二十世纪八十年代中期提出 SDM（Sparse Distributed Memory）模型 [Kanerva, 1988] 时并没有刻意模仿脑生理结构，但后来神经科学的研究发现，SDM 的稀疏编码机制在视觉、听觉、嗅觉功能的脑皮层中广泛存在，从而为理解脑的某些功能提供了一定的启发.","html":"例如，P. Kanerva 在二十世纪八十年代中期提出 SDM（Sparse Distributed Memory）模型 [Kanerva, 1988] 时并没有刻意模仿脑生理结构，但后来神经科学的研究发现，SDM 的稀疏编码机制在视觉、听觉、嗅觉功能的脑皮层中广泛存在，从而为理解脑的某些功能提供了一定的启发．"},{"id":"1.112.3","text":"自然科学研究的驱动力归结起来无外是人类对宇宙本源、万物本质、生命本性、自我本识的好奇，而“人类如何学习”无疑是一个有关自我本识的重大问题.","html":"自然科学研究的驱动力归结起来无外是人类对宇宙本源、万物本质、生命本性、自我本识的好奇，而“人类如何学习”无疑是一个有关自我本识的重大问题．"},{"id":"1.112.4","text":"从这个意义上说，机器学习不仅在信息科学中占有重要地位，还具有一定的自然科学探索色彩.","html":"从这个意义上说，机器学习不仅在信息科学中占有重要地位，还具有一定的自然科学探索色彩．"}],"html":""},"1.113":{"kind":"heading","level":2,"text":"1.7 阅读材料","pages":[16],"html":"1.7 阅读材料"},"1.114":{"kind":"para","text":"[Mitchell, 1997] 是第一本机器学习专门性教材，[Duda et al., 2001; Alpaydin, 2004; Flach, 2012] 都是出色的入门读物.[Hastie et al., 2009] 是很好的进阶读物，[Bishop, 2006] 也很有参考价值，尤其适合于贝叶斯学习偏好者.[Shalev-Shwartz and Ben-David, 2014] 则适合于理论偏好者.[Witten et al., 2011] 是基于 WEKA 撰写的入门读物，有助于初学者通过 WEKA 实践快速掌握常用机器学习算法.","pages":[16],"sentences":[{"id":"1.114.1","text":"[Mitchell, 1997] 是第一本机器学习专门性教材，[Duda et al., 2001; Alpaydin, 2004; Flach, 2012] 都是出色的入门读物.","html":"[Mitchell, 1997] 是第一本机器学习专门性教材，[Duda et al., 2001; Alpaydin, 2004; Flach, 2012] 都是出色的入门读物．"},{"id":"1.114.2","text":"[Hastie et al., 2009] 是很好的进阶读物，[Bishop, 2006] 也很有参考价值，尤其适合于贝叶斯学习偏好者.","html":"[Hastie et al., 2009] 是很好的进阶读物，[Bishop, 2006] 也很有参考价值，尤其适合于贝叶斯学习偏好者．"},{"id":"1.114.3","text":"[Shalev-Shwartz and Ben-David, 2014] 则适合于理论偏好者.","html":"[Shalev-Shwartz and Ben-David, 2014] 则适合于理论偏好者．"},{"id":"1.114.4","text":"[Witten et al., 2011] 是基于 WEKA 撰写的入门读物，有助于初学者通过 WEKA 实践快速掌握常用机器学习算法.","html":"[Witten et al., 2011] 是基于 WEKA 撰写的入门读物，有助于初学者通过 WEKA 实践快速掌握常用机器学习算法．"}],"html":""},"1.115":{"kind":"note","text":"WEKA 是著名的免费机器学习算法程序库，由新西兰 Waikato 大学研究人员基于 JAVA 开发：http://www.cs.waikato.ac.nz/ml/weka/.","pages":[16],"sentences":[{"id":"1.115.1","text":"WEKA 是著名的免费机器学习算法程序库，由新西兰 Waikato 大学研究人员基于 JAVA 开发：http://www.cs.waikato.ac.nz/ml/weka/.","html":"WEKA 是著名的免费机器学习算法程序库，由新西兰 Waikato 大学研究人员基于 JAVA 开发：http://www.cs.waikato.ac.nz/ml/weka/."}],"html":""},"1.116":{"kind":"para","text":"本书 1.5 和 1.6 节主要取材于 [周志华, 2007].《机器学习：一种人工智能途径》[Michalski et al., 1983] 汇集了 20 位学者撰写的 16 篇文章，是机器学习早期最重要的文献.该书出版后产生了很大反响，Morgan Kaufmann 出版社后来分别于 1986 年和 1990 年出版了该书的续篇，编为第二卷和第三卷.《人工智能手册》系列是图灵奖得主 E. A. Feigenbaum 与不同学者合作编写而成，该书第三卷 [Cohen and Feigenbaum, 1983] 对机器学习进行了讨论，是机器学习早期的重要文献.[Dietterich, 1997] 对机器学习领域的发展进行了评述和展望.早期的很多文献在今天仍值得重视，一些闪光的思想在相关技术进步后可能焕发新的活力，例如近来流行的“迁移学习”（transfer learning）[Pan and Yang, 2010]，恰似“类比学习”（learning by analogy）在统计学习技术大发展后的升级版；红极一时的“深度学习”（deep learning）在思想上并未显著超越二十世纪八十年代中后期神经网络学习的研究.","pages":[16,17],"sentences":[{"id":"1.116.1","text":"本书 1.5 和 1.6 节主要取材于 [周志华, 2007].《机器学习：一种人工智能途径》[Michalski et al., 1983] 汇集了 20 位学者撰写的 16 篇文章，是机器学习早期最重要的文献.","html":"本书 1.5 和 1.6 节主要取材于 [周志华, 2007].《机器学习：一种人工智能途径》[Michalski et al., 1983] 汇集了 20 位学者撰写的 16 篇文章，是机器学习早期最重要的文献．"},{"id":"1.116.2","text":"该书出版后产生了很大反响，Morgan Kaufmann 出版社后来分别于 1986 年和 1990 年出版了该书的续篇，编为第二卷和第三卷.","html":"该书出版后产生了很大反响，Morgan Kaufmann 出版社后来分别于 1986 年和 1990 年出版了该书的续篇，编为第二卷和第三卷．"},{"id":"1.116.3","text":"《人工智能手册》系列是图灵奖得主 E. A. Feigenbaum 与不同学者合作编写而成，该书第三卷 [Cohen and Feigenbaum, 1983] 对机器学习进行了讨论，是机器学习早期的重要文献.","html":"《人工智能手册》系列是图灵奖得主 E. A. Feigenbaum 与不同学者合作编写而成，该书第三卷 [Cohen and Feigenbaum, 1983] 对机器学习进行了讨论，是机器学习早期的重要文献．"},{"id":"1.116.4","text":"[Dietterich, 1997] 对机器学习领域的发展进行了评述和展望.","html":"[Dietterich, 1997] 对机器学习领域的发展进行了评述和展望．"},{"id":"1.116.5","text":"早期的很多文献在今天仍值得重视，一些闪光的思想在相关技术进步后可能焕发新的活力，例如近来流行的“迁移学习”（transfer learning）[Pan and Yang, 2010]，恰似“类比学习”（learning by analogy）在统计学习技术大发展后的升级版；红极一时的“深度学习”（deep learning）在思想上并未显著超越二十世纪八十年代中后期神经网络学习的研究.","html":"早期的很多文献在今天仍值得重视，一些闪光的思想在相关技术进步后可能焕发新的活力，例如近来流行的“迁移学习”（transfer learning）[Pan and Yang, 2010]，恰似“类比学习”（learning by analogy）在统计学习技术大发展后的升级版；红极一时的“深度学习”（deep learning）在思想上并未显著超越二十世纪八十年代中后期神经网络学习的研究．"}],"html":""},"1.117":{"kind":"note","text":"深度学习参见 5.6 节.","pages":[17],"sentences":[{"id":"1.117.1","text":"深度学习参见 5.6 节.","html":"深度学习参见 5.6 节．"}],"html":""},"1.118":{"kind":"para","text":"机器学习中关于概念学习的研究开始很早，从中产生的不少思想对整个领域都有深远影响.例如作为主流学习技术之一的决策树学习，就起源于关于概念形成的树结构研究 [Hunt and Hovland, 1963].[Winston, 1970] 在著名的“积木世界”研究中，将概念学习与基于泛化和特化的搜索过程联系起来.[Simon and Lea, 1974] 较早提出了“学习”是在假设空间中搜索的观点.[Mitchell, 1977] 稍后提出了版本空间的概念.概念学习中有很多关于规则学习的内容.","pages":[17],"sentences":[{"id":"1.118.1","text":"机器学习中关于概念学习的研究开始很早，从中产生的不少思想对整个领域都有深远影响.","html":"机器学习中关于概念学习的研究开始很早，从中产生的不少思想对整个领域都有深远影响．"},{"id":"1.118.2","text":"例如作为主流学习技术之一的决策树学习，就起源于关于概念形成的树结构研究 [Hunt and Hovland, 1963].[Winston, 1970] 在著名的“积木世界”研究中，将概念学习与基于泛化和特化的搜索过程联系起来.","html":"例如作为主流学习技术之一的决策树学习，就起源于关于概念形成的树结构研究 [Hunt and Hovland, 1963].[Winston, 1970] 在著名的“积木世界”研究中，将概念学习与基于泛化和特化的搜索过程联系起来．"},{"id":"1.118.3","text":"[Simon and Lea, 1974] 较早提出了“学习”是在假设空间中搜索的观点.","html":"[Simon and Lea, 1974] 较早提出了“学习”是在假设空间中搜索的观点．"},{"id":"1.118.4","text":"[Mitchell, 1977] 稍后提出了版本空间的概念.","html":"[Mitchell, 1977] 稍后提出了版本空间的概念．"},{"id":"1.118.5","text":"概念学习中有很多关于规则学习的内容.","html":"概念学习中有很多关于规则学习的内容．"}],"html":""},"1.119":{"kind":"note","text":"规则学习参见第 15 章.","pages":[17],"sentences":[{"id":"1.119.1","text":"规则学习参见第 15 章.","html":"规则学习参见第 15 章．"}],"html":""},"1.120":{"kind":"para","text":"奥卡姆剃刀原则主张选择与经验观察一致的最简单假设，它在自然科学如物理学、天文学等领域中是一个广为沿用的基础性原则，例如哥白尼坚持“日心说”的理由之一就是它比托勒密的“地心说”更简单且符合天文观测.奥卡姆剃刀在机器学习领域也有很多追随者 [Blumer et al., 1996].但机器学习中什么是“更简单的”这个问题一直困扰着研究者们，因此，对奥卡姆剃刀在机器学习领域的作用一直存在着争议 [Webb, 1996; Domingos, 1999].需注意的是，奥卡姆剃刀并非科学研究中唯一可行的假设选择原则，例如古希腊哲学家伊壁鸠鲁（公元前341年–前270年）提出的“多释原则”（principle of multiple explanations），主张保留与经验观察一致的所有假设 [Asmis, 1984]，这与集成学习（ensemble learning）方面的研究更加吻合.","pages":[17],"sentences":[{"id":"1.120.1","text":"奥卡姆剃刀原则主张选择与经验观察一致的最简单假设，它在自然科学如物理学、天文学等领域中是一个广为沿用的基础性原则，例如哥白尼坚持“日心说”的理由之一就是它比托勒密的“地心说”更简单且符合天文观测.","html":"奥卡姆剃刀原则主张选择与经验观察一致的最简单假设，它在自然科学如物理学、天文学等领域中是一个广为沿用的基础性原则，例如哥白尼坚持“日心说”的理由之一就是它比托勒密的“地心说”更简单且符合天文观测．"},{"id":"1.120.2","text":"奥卡姆剃刀在机器学习领域也有很多追随者 [Blumer et al., 1996].但机器学习中什么是“更简单的”这个问题一直困扰着研究者们，因此，对奥卡姆剃刀在机器学习领域的作用一直存在着争议 [Webb, 1996; Domingos, 1999].需注意的是，奥卡姆剃刀并非科学研究中唯一可行的假设选择原则，例如古希腊哲学家伊壁鸠鲁（公元前341年–前270年）提出的“多释原则”（principle of multiple explanations），主张保留与经验观察一致的所有假设 [Asmis, 1984]，这与集成学习（ensemble learning）方面的研究更加吻合.","html":"奥卡姆剃刀在机器学习领域也有很多追随者 [Blumer et al., 1996].但机器学习中什么是“更简单的”这个问题一直困扰着研究者们，因此，对奥卡姆剃刀在机器学习领域的作用一直存在着争议 [Webb, 1996; Domingos, 1999].需注意的是，奥卡姆剃刀并非科学研究中唯一可行的假设选择原则，例如古希腊哲学家伊壁鸠鲁（公元前341年–前270年）提出的“多释原则”（principle of multiple explanations），主张保留与经验观察一致的所有假设 [Asmis, 1984]，这与集成学习（ensemble learning）方面的研究更加吻合．"}],"html":""},"1.121":{"kind":"note","text":"集成学习参见第 8 章.","pages":[17],"sentences":[{"id":"1.121.1","text":"集成学习参见第 8 章.","html":"集成学习参见第 8 章．"}],"html":""},"1.122":{"kind":"para","text":"机器学习领域最重要的国际学术会议是国际机器学习会议（ICML）、国际神经信息处理系统会议（NIPS）和国际学习理论会议（COLT），重要的区域性会议主要有欧洲机器学习会议（ECML）和亚洲机器学习会议（ACML）；最重要的国际学术期刊是 Journal of Machine Learning Research 和 Machine Learning.人工智能领域的重要会议如 IJCAI、AAAI 以及重要期刊如 Artificial Intelligence、Journal of Artificial Intelligence Research，数据挖掘领域的重要会议如 KDD、ICDM 以及重要期刊如 ACM Transactions on Knowledge Discovery from Data、Data Mining and Knowledge Discovery，计算机视觉与模式识别领域的重要会议如 CVPR 以及重要期刊如 IEEE Transactions on Pattern Analysis and Machine Intelligence，神经网络领域的重要期刊如 Neural Computation、IEEE Transactions on Neural Networks and Learning Systems 等也经常发表机器学习方面的论文.此外，统计学领域的重要期刊如 Annals of Statistics 等也常有关于统计学习方面的理论文章发表.","pages":[17,18],"sentences":[{"id":"1.122.1","text":"机器学习领域最重要的国际学术会议是国际机器学习会议（ICML）、国际神经信息处理系统会议（NIPS）和国际学习理论会议（COLT），重要的区域性会议主要有欧洲机器学习会议（ECML）和亚洲机器学习会议（ACML）；最重要的国际学术期刊是 Journal of Machine Learning Research 和 Machine Learning.人工智能领域的重要会议如 IJCAI、AAAI 以及重要期刊如 Artificial Intelligence、Journal of Artificial Intelligence Research，数据挖掘领域的重要会议如 KDD、ICDM 以及重要期刊如 ACM Transactions on Knowledge Discovery from Data、Data Mining and Knowledge Discovery，计算机视觉与模式识别领域的重要会议如 CVPR 以及重要期刊如 IEEE Transactions on Pattern Analysis and Machine Intelligence，神经网络领域的重要期刊如 Neural Computation、IEEE Transactions on Neural Networks and Learning Systems 等也经常发表机器学习方面的论文.","html":"机器学习领域最重要的国际学术会议是国际机器学习会议（ICML）、国际神经信息处理系统会议（NIPS）和国际学习理论会议（COLT），重要的区域性会议主要有欧洲机器学习会议（ECML）和亚洲机器学习会议（ACML）；最重要的国际学术期刊是 Journal of Machine Learning Research 和 Machine Learning.人工智能领域的重要会议如 IJCAI、AAAI 以及重要期刊如 Artificial Intelligence、Journal of Artificial Intelligence Research，数据挖掘领域的重要会议如 KDD、ICDM 以及重要期刊如 ACM Transactions on Knowledge Discovery from Data、Data Mining and Knowledge Discovery，计算机视觉与模式识别领域的重要会议如 CVPR 以及重要期刊如 IEEE Transactions on Pattern Analysis and Machine Intelligence，神经网络领域的重要期刊如 Neural Computation、IEEE Transactions on Neural Networks and Learning Systems 等也经常发表机器学习方面的论文．"},{"id":"1.122.2","text":"此外，统计学领域的重要期刊如 Annals of Statistics 等也常有关于统计学习方面的理论文章发表.","html":"此外，统计学领域的重要期刊如 Annals of Statistics 等也常有关于统计学习方面的理论文章发表．"}],"html":""},"1.123":{"kind":"para","text":"国内不少书籍包含机器学习方面的内容，例如 [陆汝钤, 1996].[李航, 2012] 是以统计学习为主题的读物.国内机器学习领域最主要的活动是两年一次的中国机器学习大会（CCML）以及每年举行的“机器学习及其应用”研讨会（MLA）；很多学术刊物都经常刊登有关机器学习的论文.","pages":[18],"sentences":[{"id":"1.123.1","text":"国内不少书籍包含机器学习方面的内容，例如 [陆汝钤, 1996].[李航, 2012] 是以统计学习为主题的读物.","html":"国内不少书籍包含机器学习方面的内容，例如 [陆汝钤, 1996].[李航, 2012] 是以统计学习为主题的读物．"},{"id":"1.123.2","text":"国内机器学习领域最主要的活动是两年一次的中国机器学习大会（CCML）以及每年举行的“机器学习及其应用”研讨会（MLA）；很多学术刊物都经常刊登有关机器学习的论文.","html":"国内机器学习领域最主要的活动是两年一次的中国机器学习大会（CCML）以及每年举行的“机器学习及其应用”研讨会（MLA）；很多学术刊物都经常刊登有关机器学习的论文．"}],"html":""},"1.124":{"kind":"heading","level":2,"text":"习题","pages":[19],"html":"习题"},"1.125":{"kind":"para","text":"1.1 表 1.1 中若只包含编号为 1 和 4 的两个样例，试给出相应的版本空间.","pages":[19],"sentences":[{"id":"1.125.1","text":"1.1 表 1.1 中若只包含编号为 1 和 4 的两个样例，试给出相应的版本空间.","html":"1.1 表 1.1 中若只包含编号为 1 和 4 的两个样例，试给出相应的版本空间．"}],"html":""},"1.126":{"kind":"para","text":"1.2 与使用单个合取式来进行假设表示相比，使用“析合范式”将使得假设空间具有更强的表示能力.例如\n$$ \\text{好瓜} \\leftrightarrow \\big((\\text{色泽}=*)\\wedge(\\text{根蒂}=\\text{蜷缩})\\wedge(\\text{敲声}=*)\\big) \\vee \\big((\\text{色泽}=\\text{乌黑})\\wedge(\\text{根蒂}=*)\\wedge(\\text{敲声}=\\text{沉闷})\\big), $$\n会把“(色泽=青绿) $\\wedge$ (根蒂=蜷缩) $\\wedge$ (敲声=清脆)”以及“(色泽=乌黑) $\\wedge$ (根蒂=硬挺) $\\wedge$ (敲声=沉闷)”都分类为“好瓜”.若使用最多包含 $k$ 个合取式的析合范式来表达表 1.1 西瓜分类问题的假设空间，试估算共有多少种可能的假设.","pages":[19],"sentences":[{"id":"1.126.1","text":"1.2 与使用单个合取式来进行假设表示相比，使用“析合范式”将使得假设空间具有更强的表示能力.","html":"1.2 与使用单个合取式来进行假设表示相比，使用“析合范式”将使得假设空间具有更强的表示能力．"},{"id":"1.126.2","text":"例如\n$$ \\text{好瓜} \\leftrightarrow \\big((\\text{色泽}=*)\\wedge(\\text{根蒂}=\\text{蜷缩})\\wedge(\\text{敲声}=*)\\big) \\vee \\big((\\text{色泽}=\\text{乌黑})\\wedge(\\text{根蒂}=*)\\wedge(\\text{敲声}=\\text{沉闷})\\big), $$\n会把“(色泽=青绿) $\\wedge$ (根蒂=蜷缩) $\\wedge$ (敲声=清脆)”以及“(色泽=乌黑) $\\wedge$ (根蒂=硬挺) $\\wedge$ (敲声=沉闷)”都分类为“好瓜”.","html":"例如\u003cspan class=\"math-display\">\u003cmjx-container class=\"MathJax\" jax=\"SVG\" overflow=\"overflow\" display=\"true\">\u003csvg style=\"vertical-align: -1.068ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"98.76ex\" height=\"3.267ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -972 43652.1 1444\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\u003cdefs>\u003cpath id=\"MJX-122-NCM-N-2194\" d=\"M931 234C938 237 942 243 942 250C942 257 938 263 931 266C883 282 838 316 796 368C768 403 749 444 740 491C737 504 729 510 716 510C700 510 692 502 692 486L692 483L693 481C710 395 754 326 827 274L173 274C246 326 290 395 307 481L308 483L308 486C308 502 300 510 284 510C271 510 263 504 260 491C251 444 232 403 204 368C162 316 117 282 69 266C62 263 58 257 58 250C58 243 62 237 69 234C117 218 162 184 204 132C232 97 251 56 260 9C263-4 271-10 284-10C300-10 308-2 308 14L308 17L307 19C290 105 246 174 173 226L827 226C754 174 710 105 693 19L692 17L692 14C692-2 700-10 716-10C729-10 737-4 740 9C749 56 768 97 796 132C838 184 883 为编写其巨著 Computers and Thought，在 1961 年邀请萨缪尔提供一个该程序最好的对弈实例.于是，萨缪尔借机向康涅狄格州的跳棋冠军、当时全美排名第四的棋手发起了挑战，结果萨缪尔程序获胜，在当时引起轰动.","pages":[22],"sentences":[{"id":"1.168.1","text":"1952 年，阿瑟·萨缪尔（Arthur Samuel, 1901—1990）在 IBM 公司研制了一个西洋跳棋程序，这个程序具有自学习能力，可通过对大量棋局的分析逐渐辨识出当前局面下的“好棋”和“坏棋”，从而不断提高弈棋水平，并很快就下赢了萨缪尔自己.","html":"1952 年，阿瑟·萨缪尔（Arthur Samuel, 1901—1990）在 IBM 公司研制了一个西洋跳棋程序，这个程序具有自学习能力，可通过对大量棋局的分析逐渐辨识出当前局面下的“好棋”和“坏棋”，从而不断提高弈棋水平，并很快就下赢了萨缪尔自己．"},{"id":"1.168.2","text":"1956 年，萨缪尔应约翰·麦卡锡（John McCarthy，“人工智能之父”，1971 年图灵奖得主）之邀，在标志着人工智能学科诞生的达特茅斯会议上介绍这项工作.","html":"1956 年，萨缪尔应约翰·麦卡锡（John McCarthy，“人工智能之父”，1971 年图灵奖得主）之邀，在标志着人工智能学科诞生的达特茅斯会议上介绍这项工作．"},{"id":"1.168.3","text":"萨缪尔发明了“机器学习”这个词，将其定义为“不显式编程地赋予计算机能力的研究领域”.","html":"萨缪尔发明了“机器学习”这个词，将其定义为“不显式编程地赋予计算机能力的研究领域”．"},{"id":"1.168.4","text":"他的文章“Some studies in machine learning using the game of checkers”1959 年在 IBM Journal 正式发表后，爱德华·费根鲍姆（Edward Feigenbaum，“知识工程之父”，1994 年图灵奖得主）为编写其巨著 Computers and Thought，在 1961 年邀请萨缪尔提供一个该程序最好的对弈实例.","html":"他的文章“Some studies in machine learning using the game of checkers”1959 年在 IBM Journal 正式发表后，爱德华·费根鲍姆（Edward Feigenbaum，“知识工程之父”，1994 年图灵奖得主）为编写其巨著 Computers and Thought，在 1961 年邀请萨缪尔提供一个该程序最好的对弈实例．"},{"id":"1.168.5","text":"于是，萨缪尔借机向康涅狄格州的跳棋冠军、当时全美排名第四的棋手发起了挑战，结果萨缪尔程序获胜，在当时引起轰动.","html":"于是，萨缪尔借机向康涅狄格州的跳棋冠军、当时全美排名第四的棋手发起了挑战，结果萨缪尔程序获胜，在当时引起轰动．"}],"html":""},"1.169":{"kind":"note","text":"这个跳棋程序实质上使用了强化学习技术，参见第 16 章.","pages":[22],"sentences":[{"id":"1.169.1","text":"这个跳棋程序实质上使用了强化学习技术，参见第 16 章.","html":"这个跳棋程序实质上使用了强化学习技术，参见第 16 章．"}],"html":""},"1.170":{"kind":"para","text":"事实上，萨缪尔跳棋程序不仅在人工智能领域产生了重大影响，还影响到整个计算机科学的发展.早期计算机科学研究认为，计算机不可能完成事先没有显式编程好的任务，而萨缪尔跳棋程序否证了这个假设.另外，这个程序是最早在计算机上执行非数值计算任务的程序之一，其逻辑指令设计思想极大地影响了 IBM 计算机的指令集，并很快被其他计算机的设计者采用.","pages":[22],"sentences":[{"id":"1.170.1","text":"事实上，萨缪尔跳棋程序不仅在人工智能领域产生了重大影响，还影响到整个计算机科学的发展.","html":"事实上，萨缪尔跳棋程序不仅在人工智能领域产生了重大影响，还影响到整个计算机科学的发展．"},{"id":"1.170.2","text":"早期计算机科学研究认为，计算机不可能完成事先没有显式编程好的任务，而萨缪尔跳棋程序否证了这个假设.","html":"早期计算机科学研究认为，计算机不可能完成事先没有显式编程好的任务，而萨缪尔跳棋程序否证了这个假设．"},{"id":"1.170.3","text":"另外，这个程序是最早在计算机上执行非数值计算任务的程序之一，其逻辑指令设计思想极大地影响了 IBM 计算机的指令集，并很快被其他计算机的设计者采用.","html":"另外，这个程序是最早在计算机上执行非数值计算任务的程序之一，其逻辑指令设计思想极大地影响了 IBM 计算机的指令集，并很快被其他计算机的设计者采用．"}],"html":""}}});</script></body></html>
